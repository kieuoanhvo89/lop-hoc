<script>
/* ====== Thư viện hình toán (vẽ bằng mã, không cần AI tự viết SVG) ====== */
const FC = { ink: "#183F69", blue: "#2F80ED", yellow: "#F2A900", green: "#27AE60", red: "#EB5757", purple: "#9B51E0", pale: ["#E3EEFF", "#FFF1C1", "#E2F0CB", "#FDE2E4", "#E8DAEF"], wood: "#F2B84B", head: "#E4572E" };

const arr = (v, d) => (Array.isArray(v) ? v : d);
const num = (v, d) => (isFinite(+v) && v !== "" && v !== null ? +v : d);

/* 1. Sơ đồ cây */
function figTree(s) {
  const lv = arr(s.levels, null);
  const build = (d) => (!lv || d >= lv.length ? [] : arr(lv[d].items, []).map(it => ({ label: String(it), children: build(d + 1) })));

  const draw = (nd) => { nd.children.forEach(c => { const x1 = X(nd.d) + nw, y1 = Y(nd.y), x2 = X(c.d), y2 = Y(c.y); e += `<path d="M${x1} ${y1} C${x1 + 28} ${y1} ${x2 - 28} ${y2} ${x2} ${y2}" fill="none" stroke="${FC.ink}" stroke-width="2"/>`; draw(c); });

  let cap = "";

function rpMetrics(S,A,R){
 const per=A.map(a=>{const r=(R[a.id]||{})[S.id]||null;return{a,r,sc:r&&r.maxScore?r.score/r.maxScore*100:null,learn:r?(r.pct||0):0,done:!!(r&&r.completedAt),acc:r&&r.qTotal?r.qOk/r.qTotal*100:null}});
 const st=per.filter(p=>p.r),sc=per.filter(p=>p.sc!=null);let qOk=0,qT=0,ms=0,tries=0,qn=0,gave=0;
 st.forEach(p=>{qOk+=p.r.qOk||0;qT+=p.r.qTotal||0;ms+=p.r.totalMs||0;Object.values(p.r.slides||{}).forEach(s=>{if(s&&s.q){qn++;tries+=s.tries||0;if(s.gave)gave++}})});
 let trend=null;if(sc.length>=4){const h=Math.floor(sc.length/2),d=avgOf(sc.slice(h).map(p=>p.sc))-avgOf(sc.slice(0,h).map(p=>p.sc));trend=d>=10?1:d<=-10?-1:0}
 return{S,per,nA:per.length,nStart:st.length,nDone:per.filter(p=>p.done).length,learn:per.length?avgOf(per.map(p=>p.learn)):0,score:avgOf(sc.map(p=>p.sc)),acc:qT?qOk/qT*100:null,qOk,qT,ms,msPerQ:qT?ms/qT:null,tries:qn?tries/qn:null,gave,trend}}

/* Khung nhận xét tự động (theo quy tắc từ số liệu học tập – giáo viên chỉnh sửa trước khi gửi) */
function autoComment(m,ctx){const n=given(m.S.name),out=[];
 out.push(`Trong ${ctx.label} (${m.nA} bài), em ${n} đã hoàn thành ${m.nDone}/${m.nA} bài, trung bình học ${pc(m.learn)} nội dung`+(m.score!=null?` và đạt ${pc(m.score)} số điểm ở các câu hỏi (${m.qOk}/${m.qT} câu đúng).`:"."));
 if(!m.nStart){out.push(`Em chưa bắt đầu làm bài nào trong giai đoạn này. Mong phụ huynh nhắc em vào học đều đặn để theo kịp lớp.`);return out.join(" ")}
 const s=m.score;
 if(s!=null){out.push(s>=85?"Kết quả rất tốt: em nắm vững kiến thức và làm bài chắc chắn.":s>=70?"Kết quả khá tốt, em hiểu bài và làm đúng phần lớn các câu.":s>=50?"Kết quả ở mức trung bình khá: em hiểu bài nhưng còn nhầm lẫn ở một số câu.":"Em còn nhiều chỗ chưa vững, cần được ôn lại kiến thức và làm thêm bài tập cơ bản.")}
 const sc=m.per.filter(p=>p.sc!=null&&p.done).sort((a,b)=>b.sc-a.sc);
 if(sc.length>=2){const b=sc[0],w=sc[sc.length-1];if(b.sc>=70)out.push(`Em làm tốt nhất ở bài “${cut(b.a.title,50)}” (${pc(b.sc)}).`);if(w.sc<70&&w.a.id!==b.a.id)out.push(`Cần ôn thêm bài “${cut(w.a.title,50)}” (${pc(w.sc)}).`)}
 const miss=m.per.filter(p=>!p.done);if(miss.length){out.push(`Em chưa hoàn thành ${miss.length} bài${miss.length<=3?": "+miss.map(p=>"“"+cut(p.a.title,40)+"”").join(", "):""}; mong phụ huynh nhắc em hoàn thành.`)}
 if(m.tries!=null&&m.tries>=1.6)out.push("Em thường phải thử nhiều lần mới ra đáp án đúng – nên đọc kỹ đề và suy nghĩ trước khi chọn.");
 if(m.gave>0)out.push(`Có ${m.gave} câu em chọn xem lời giải; nên tự suy nghĩ thêm một lúc trước khi xem.`);
 if(m.msPerQ&&ctx.msPerQ){if(m.msPerQ>ctx.msPerQ*1.6)out.push("Em làm bài khá chậm so với mặt bằng lớp; có thể luyện thêm tốc độ với các bài quen thuộc.");else if(m.msPerQ<ctx.msPerQ*.6&&m.acc!=null&&m.acc<70)out.push("Em làm rất nhanh nhưng độ chính xác chưa cao – nên chậm lại và kiểm tra kỹ trước khi trả lời.")}
 if(m.trend===1)out.push("Điểm số của em đang tiến bộ rõ rệt so với các bài đầu – rất đáng khen!");else if(m.trend===-1)out.push("Điểm số các bài gần đây thấp hơn các bài đầu; phụ huynh nên động viên và hỏi xem em gặp khó khăn ở phần nào.");
 if(ctx.avgScore!=null&&s!=null)out.push(s>=ctx.avgScore+8?"So với trung bình lớp, em đang ở nhóm trên.":s<=ctx.avgScore-8?"So với trung bình lớp, em đang thấp hơn một chút và cần được hỗ trợ thêm.":"So với trung bình lớp, em ở mức tương đương.");
 return out.join(" ")}

/* Nội dung email báo cáo (chữ thuần, có thanh ██░░ thay biểu đồ) */
const durTxt=ms=>{const m=Math.round((ms||0)/60000);return m<1?"dưới 1 phút":m<60?m+" phút":Math.floor(m/60)+" giờ "+(m%60)+" phút"};
const tbar=v=>{const k=Math.max(0,Math.min(10,Math.round((v||0)/10)));return "█".repeat(k)+"░".repeat(10-k)};
function rpEmail(m,ctx,cmt,note){const L=[`Kính gửi phụ huynh em ${m.S.name},`,"",`${brand()} xin gửi báo cáo học tập của em ${given(m.S.name)} – ${ctx.label}${ctx.range?" ("+ctx.range+")":""}.`,"","TỔNG QUAN",
 `• Hoàn thành: ${m.nDone}/${m.nA} bài`,`• Đã học trung bình: ${pc(m.learn)} nội dung`,`• Điểm trung bình: ${pc(m.score)}${ctx.avgScore!=null?" (trung bình lớp "+pc(ctx.avgScore)+")":""}`,`• Câu đúng: ${m.qOk}/${m.qT}`,`• Tổng thời gian học: ${durTxt(m.ms)}`,"","KẾT QUẢ TỪNG BÀI"];
 m.per.forEach((p,i)=>L.push(`${i+1}. ${cut(p.a.title,45)}`,"    "+(p.sc!=null?tbar(p.sc)+" "+pc(p.sc)+(p.done?"":" (chưa xong)"):"░░░░░░░░░░ chưa làm")));
 L.push("","NHẬN XÉT",cmt.trim());if(note&&note.trim())L.push("","LƯU Ý RIÊNG TỪ GIÁO VIÊN",note.trim());L.push("","Trân trọng,",signer());return L.join("\n")}

 const sc=R.filter(r=>r.maxScore).map(r=>r.score/r.maxScore*100),bins=[["85–100%",x=>x>=85,"var(--ok)"],["70–84%",x=>x>=70&&x<85,"var(--pr)"],["50–69%",x=>x>=50&&x<70,"var(--wa)"],["dưới 50%",x=>x<50,"var(--no)"]];
 const nQ={},ok={},tr={};R.forEach(r=>Object.entries(r.slides||{}).forEach(([i,s])=>{if(!s||!s.q)return;if(!(s.tries>0||s.ok||s.gave))return;nQ[i]=(nQ[i]||0)+1;if(s.ok)ok[i]=(ok[i]||0)+1;tr[i]=(tr[i]||0)+(s.tries||0)}));
 const ids=Object.keys(nQ).map(Number).sort((x,y)=>x-y),rate=i=>(ok[i]||0)/nQ[i]*100,ttl=i=>{const s=L&&L.slides[i];return s?(s.title||s.problem||"").toString().replace(/\s+/g," ").slice(0,70):""};
 const items=ids.map((i,k)=>({l:"Câu "+(k+1),t:"Câu "+(k+1)+" (slide "+(i+1)+") "+ttl(i),v:[rate(i)]})),hard=ids.map((i,k)=>({i,k,r:rate(i)})).filter(x=>x.r<70).sort((x,y)=>x.r-y.r).slice(0,3);
 box.innerHTML=`<div class="panel"><h2>📊 Biểu đồ bài này</h2><div class="row" style="align-items:flex-start;gap:24px"><div style="flex:1;min-width:240px"><b>Phân bố điểm của lớp</b><div style="margin-top:8px">${bins.map(b=>{const n=sc.filter(b[1]).length;return`<div class="row" style="flex-wrap:nowrap;margin:5px 0"><span style="width:78px;font-size:13px">${b[0]}</span><div style="flex:1">${hbar(sc.length?n/sc.length*100:0,b[2])}</div><b style="width:34px;text-align:right">${n}</b></div>`}).join("")}</div><p class="note">${sc.length} em đã làm · điểm TB ${pc(avgOf(sc))}</p></div>

/* ---------- Điều khoản & bảo mật (bản nháp) ---------- */
ACT.terms=()=>modal(`<div class="row"><h2 class="grow" style="margin:0">Điều khoản sử dụng &amp; chính sách bảo mật</h2><button class="sec sm" onclick="closeModal()">Đóng</button></div><p class="note">Bản nháp – người vận hành nên rà soát lại với tư vấn pháp lý trước khi công bố rộng rãi.</p>
 <div style="line-height:1.65;font-size:15px"><b>1. Dịch vụ.</b> Ứng dụng giúp giáo viên giao bài, chiếu bài giảng, tổ chức quiz và theo dõi kết quả học tập. Học sinh sử dụng miễn phí; giáo viên được dùng thử đủ chức năng trong thời gian ghi trên màn hình, sau đó cần đăng ký gói trả phí để tiếp tục tạo lớp, giao bài, chiếu trực tiếp, quiz và gửi báo cáo. Khi hết hạn, dữ liệu vẫn được giữ để giáo viên xem và sao lưu.<br><br>
 <b>2. Dữ liệu thu thập.</b> Tài khoản giáo viên (tên, email); lớp, học sinh (họ tên, tên đăng nhập, email phụ huynh nếu giáo viên nhập), bài giảng, bài giao, kết quả và thời gian làm bài. Dữ liệu lưu trên hạ tầng Google Firebase (máy chủ khu vực Singapore).<br><br>
 <b>3. Trách nhiệm của giáo viên.</b> Giáo viên chịu trách nhiệm có sự đồng ý của phụ huynh/người giám hộ khi nhập thông tin học sinh (đặc biệt học sinh dưới 16 tuổi) và chỉ dùng dữ liệu cho mục đích dạy học.<br><br>
 <b>4. Bảo mật.</b> Dữ liệu của mỗi giáo viên chỉ giáo viên đó và học sinh trong lớp tương ứng truy cập được. Chúng tôi không bán dữ liệu cho bên thứ ba. Email báo cáo gửi qua dịch vụ EmailJS và tài khoản email do chính giáo viên cấu hình.<br><br>
 <b>5. Yêu cầu xóa/xuất dữ liệu.</b> Giáo viên có thể tự sao lưu dữ liệu bằng nút “Sao lưu” và gửi yêu cầu xóa tài khoản qua mục Góp ý.<br><br>
 <b>6. Thanh toán.</b> Phí được chuyển khoản theo mã QR; tài khoản được nâng cấp sau khi người vận hành xác nhận đã nhận tiền. Phí đã thanh toán không hoàn lại cho thời gian đã sử dụng, trừ trường hợp lỗi do dịch vụ.<br><br>
 <b>7. Thay đổi.</b> Điều khoản có thể được cập nhật; việc tiếp tục sử dụng nghĩa là chấp nhận bản mới.</div>`);

let LOGO_NEW=undefined;
function shrinkImg(file,px,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-s)/2,sy=(im.naturalHeight-s)/2,c=document.createElement("canvas");c.width=c.height=px;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,px,px);g.drawImage(im,sx,sy,s,s,0,0,px,px);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Không đọc được ảnh"))};im.src=u})}
function shrinkUrl(url,px,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=px;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,px,px);g.drawImage(im,0,0,px,px);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>res("");im.src=url})}

function stlHtml(st,cid){return st.length?`<div style="overflow:auto"><table><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Mật khẩu</th><th>Email phụ huynh</th><th></th></tr>${st.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.username||"")}</td><td>${s.pw?`<a class="lk" data-act="showpw" data-pw="${esc(s.pw)}">Xem</a>`:'<span class="note">–</span>'}</td><td>${esc(s.parentEmail||"")||'<span class="note">–</span>'}</td><td class="n" style="white-space:nowrap"><button class="sm" data-act="stuview" data-u="${s.id}">Tiến độ</button> <button class="sec sm" data-act="editst" data-u="${s.id}" data-c="${cid}">Sửa</button> <button class="sec sm" data-act="resetpw" data-u="${s.id}" data-c="${cid}">Đổi MK</button> <button class="red sm" data-act="rmst" data-id="${s.id}" data-c="${cid}">Bỏ</button></td></tr>`).join("")}</table></div>`:'<p class="note">Chưa có học sinh.</p>'}

ACT.editst=async d=>{const s=await DB.get("users/"+d.u);const o=modal(`<h2>Sửa thông tin học sinh</h2><label class="l">Họ tên</label><input id="en" value="${esc(s.name)}"><label class="l">Email phụ huynh (không bắt buộc)</label><input id="ee" type="email" value="${esc(s.parentEmail||"")}" placeholder="phuhuynh@gmail.com">
 <div class="row" style="margin-top:14px"><button id="eok">Lưu</button><button class="sec" onclick="closeModal()">Hủy</button></div>`);
 $("eok").onclick=async()=>{const n=$("en").value.trim(),m=$("ee").value.trim().toLowerCase();if(!n)return;if(m&&!m.includes("@")){alert("Email chưa đúng.");return}try{await DB.update("users/"+d.u,{name:n,parentEmail:m});o.remove();toast("Đã lưu.");classView(d.c)}catch(e){alert(authErr(e))}}};
ACT.resetpw=async d=>{const s=await DB.get("users/"+d.u);const nw=prompt("Mật khẩu mới cho “"+s.name+"” (ít nhất 6 ký tự):",genPw());if(!nw)return;if(nw.length<6){alert("Mật khẩu cần ít nhất 6 ký tự.");return}
 let cur=s.pw||"";for(let k=0;k<2;k++){if(!cur){cur=prompt("Cô chưa lưu mật khẩu hiện tại của em này. Nếu cô còn nhớ mật khẩu em đang dùng, nhập vào đây:")||"";if(!cur)return}
  try{toast("Đang đổi mật khẩu…");await DB.resetPw(toEmail(s.username),cur,nw);await DB.update("users/"+d.u,{pw:nw});modal(`<h2>Đã đổi mật khẩu</h2><p>Học sinh <b>${esc(s.name)}</b> · tên đăng nhập <b>${esc(s.username)}</b></p><p>Mật khẩu mới: <b style="font-size:22px">${esc(nw)}</b></p><div class="row"><button onclick="closeModal()">Xong</button></div>`);return}
  catch(e){if(String(e.code||"").includes("invalid-credential")||String(e.code||"").includes("wrong-password")||String(e.code||"").includes("invalid-login")){cur="";if(k===0)alert("Mật khẩu đang lưu không còn đúng (có thể em đã tự đổi). Cô nhập mật khẩu em đang dùng nhé.");else alert("Vẫn chưa đúng. Cô hỏi lại em hoặc tạo lại tài khoản cho em với tên đăng nhập mới.")}else{alert(authErr(e));return}}}};
async function refreshStl(cid){const us=await DB.list("users",[["teacherId","==",UID]]);const st=us.filter(u=>u.role==="student"&&(u.classIds||[]).includes(cid)).sort((a,b)=>a.name.localeCompare(b.name,"vi"));const e=$("stl");if(e)e.innerHTML=stlHtml(st,cid);const c=$("ccount");if(c)c.textContent=st.length}
function genPw(){return String(Math.floor(100000+Math.random()*900000))}
ACT.addst=async d=>{const cid=d.id,lines=$("bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return;$("addb").disabled=true;const out=[];let i=0;
 for(const ln of lines){i++;$("addm").textContent=`Đang tạo ${i}/${lines.length}…`;const p=ln.split(/[;\t]/).map(s=>s.trim());const name=p[0];let user=slug(p[2]!==undefined&&p[1]?p[1]:p[1]||"")||"";let pw=p[2]||genPw();if(!/^[a-z0-9._-]{3,30}$/.test(user||"x")||!user)user=(slug(name).slice(-12)||"hs")+Math.floor(10+Math.random()*90);
  if(pw.length<6)pw=genPw();let ok=false,err="";for(let k=0;k<3&&!ok;k++){try{const uid=await DB.createUser(toEmail(user),pw);await DB.set("users/"+uid,{role:"student",name,username:user,pw,parentEmail:(p[3]||"").toLowerCase(),teacherId:UID,classIds:[cid],createdAt:Date.now()});ok=true}catch(e){if(String(e.code||"").includes("email-already-in-use")){user=user.replace(/\d+$/,"")+Math.floor(100+Math.random()*900)}else{err=authErr(e);break}}}
  out.push({name,user,pw,ok,err})}
 $("addb").disabled=false;$("addm").textContent="";const good=out.filter(o=>o.ok);
 $("addres").innerHTML=`<div class="panel" style="margin:12px 0 0;border-color:var(--ok)"><b>Đã tạo ${good.length}/${out.length} tài khoản.</b> <span class="note">Cô lưu lại danh sách này, mật khẩu sẽ không hiện lại.</span>
 <table><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Mật khẩu</th></tr>${out.map(o=>`<tr><td>${esc(o.name)}</td><td>${o.ok?esc(o.user):'<span class="chip no">Lỗi</span> '+esc(o.err)}</td><td>${o.ok?esc(o.pw):""}</td></tr>`).join("")}</table>
 <div class="row" style="margin-top:8px"><button class="sec sm" id="csvacc">Tải danh sách (CSV)</button></div></div>`;
 $("csvacc").onclick=()=>dl("tai-khoan-hoc-sinh.csv","﻿Họ tên,Tên đăng nhập,Mật khẩu\n"+good.map(o=>[o.name,o.user,o.pw].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");
 $("bulk").value=out.filter(o=>!o.ok).map(o=>o.name).join("\n");refreshStl(cid)};

 const as=(await DB.list("assignments",[["teacherId","==",UID]])).filter(a=>!a.quizOnly&&cids.includes(a.classId)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const rs=await Promise.all(as.map(a=>DB.get(`assignments/${a.id}/results/${u.id}`).catch(()=>null)));window._stv={u,as,rs};

function say(m,c){P.msg=m;P.msgc=c||"";const e=$("pmsg");if(e){e.textContent=m;e.className="msgl "+(c||"")}}
function answer(v){const s=P.sl[P.cur],it=s.it;if(!it||s.ok||s.gave)return;s.tries++;P.dirty=true;
 if(it.kind==="mc"&&it.correct==null){s.ok=true;s.pts=0;P.st=clicks(P.cur);P.msg="Đã ghi nhận đáp án của em.";P.msgc="";draw();savePlayer(true);return}
 if(judgeAns(it,v)){s.ok=true;s.pts=ptsOf(s.tries,false);P.st=clicks(P.cur);P.msg="✓ Đúng rồi! +"+s.pts+" điểm";P.msgc="ok";draw();savePlayer(true)}
 else{if(it.kind==="mc"){if(!s.wrong.includes(v))s.wrong.push(v)}else{const w=String(v).slice(0,40);if(!s.wt.includes(w)&&s.wt.length<8)s.wt.push(w)}P.msg="✗ Chưa đúng, em thử lại nhé ("+s.tries+" lần)";P.msgc="no";draw();savePlayer(true)}}
ACT.pick=d=>answer(+d.i);ACT.psend=()=>{const i=$("pans");if(i&&i.value.trim())answer(i.value.trim());else if(i)say("Em nhập đáp án trước nhé.","no")};
ACT.pgive=()=>{const s=P.sl[P.cur];s.gave=true;s.pts=0;P.st=clicks(P.cur);P.msg="Lời giải đã hiện, em xem kỹ nhé.";P.msgc="";P.dirty=true;draw();savePlayer(true)};
function nextStep(){if(!P)return;if(P.st<clicks(P.cur)){P.st++;P.msg="";draw()}else if(P.cur<P.n-1){gotoSlide(P.cur+1)}else{toast("Em đã đến slide cuối.");stopPlayer(false)}}
ACT.pnext=()=>{if(P&&!P.live)nextStep()};ACT.pprev=()=>{if(P&&!P.live)prevSlide()};
function prevSlide(){if(P&&P.cur>0)gotoSlide(P.cur-1)}
function gotoSlide(i){P.cur=i;const s=P.sl[i];P.st=(s.ok||s.gave)?clicks(i):0;P.msg="";P.msgc="";P.dirty=true;draw();savePlayer(true)}

 lockActs();
 $("app").innerHTML='<div class="wrap narrow"><p class="note" style="text-align:center">Đang tải…</p></div>';DB.onAuth(boot)})();
