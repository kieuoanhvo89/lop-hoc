<style>

<script>
/* ====== Thư viện hình toán (vẽ bằng mã, không cần AI tự viết SVG) ====== */
const FC = { ink: "#183F69", blue: "#2F80ED", yellow: "#F2A900", green: "#27AE60", red: "#EB5757", purple: "#9B51E0", pale: ["#E3EEFF", "#FFF1C1", "#E2F0CB", "#FDE2E4", "#E8DAEF"], wood: "#F2B84B", head: "#E4572E" };
const fx = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tw = (t, fs) => String(t).length * fs * 0.58 + 6;
const txt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="${o.fs || 16}" font-weight="${o.b ? 700 : 400}" fill="${o.c || FC.ink}" text-anchor="${o.a || "middle"}" dominant-baseline="${o.v || "central"}">${fx(t)}</text>`;
const wrap = (w, h, body, title) => ({ w, h: h + (title ? 34 : 0), svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + (title ? 34 : 0)}" width="${w}" height="${h + (title ? 34 : 0)}"><rect width="100%" height="100%" fill="#fff"/>${title ? txt(w / 2, 18, title, { fs: 16, b: 1 }) : ""}<g transform="translate(0 ${title ? 34 : 0})">${body}</g></svg>` });
const arr = (v, d) => (Array.isArray(v) ? v : d);
const num = (v, d) => (isFinite(+v) && v !== "" && v !== null ? +v : d);

/* 1. Sơ đồ cây */
function figTree(s) {
  const lv = arr(s.levels, null);
  const build = (d) => (!lv || d >= lv.length ? [] : arr(lv[d].items, []).map(it => ({ label: String(it), children: build(d + 1) })));
  const root = lv ? { label: String(s.root || "Bắt đầu"), children: build(0) } : { label: String(s.root || ""), children: arr(s.children, []) };
  let leaf = 0, maxD = 0, maxL = 0;
  const walk = (n, d) => { n.d = d; maxD = Math.max(maxD, d); maxL = Math.max(maxL, String(n.label).length); const ch = arr(n.children, []); n.children = ch; if (!ch.length) n.y = leaf++; else { ch.forEach(c => walk(c, d + 1)); n.y = (ch[0].y + ch[ch.length - 1].y) / 2; } };
  walk(root, 0);
  const nw = Math.min(150, Math.max(64, maxL * 10 + 24)), nh = 32, cw = nw + 56, rh = 44, top = lv ? 30 : 10;
  const W = (maxD + 1) * cw - 56 + 20, H = leaf * rh + top + 10;
  let e = "", n = "";
  const X = (d) => 10 + d * cw, Y = (y) => top + y * rh + nh / 2 + 2;
  const draw = (nd) => { nd.children.forEach(c => { const x1 = X(nd.d) + nw, y1 = Y(nd.y), x2 = X(c.d), y2 = Y(c.y); e += `<path d="M${x1} ${y1} C${x1 + 28} ${y1} ${x2 - 28} ${y2} ${x2} ${y2}" fill="none" stroke="${FC.ink}" stroke-width="2"/>`; draw(c); });
    const col = nd.d === 0 ? FC.pale[1] : FC.pale[(nd.d - 1) % 3 === 0 ? 0 : (nd.d - 1) % 3 === 1 ? 2 : 3];
    n += `<rect x="${X(nd.d)}" y="${Y(nd.y) - nh / 2}" width="${nw}" height="${nh}" rx="${nh / 2}" fill="${col}" stroke="${FC.ink}" stroke-width="2"/>` + txt(X(nd.d) + nw / 2, Y(nd.y), nd.label, { fs: 15, b: 1 }); };
  draw(root);
  let cap = "";
  if (lv) lv.forEach((l, i) => { if (l.name) cap += txt(X(i + 1) + nw / 2, 12, l.name, { fs: 13, c: FC.blue, b: 1 }); });
  let extra = "", H2 = H;
  if (s.count && leaf) { extra = txt(W / 2, H + 14, `Có tất cả ${leaf} cách`, { fs: 16, b: 1, c: FC.red }); H2 = H + 30; }
  return wrap(W, H2, cap + e + n + extra, s.title);
}
/* 2. Bảng */
function figTable(s) {
  const hd = arr(s.headers, []).map(String), rows = arr(s.rows, []).map(r => arr(r, []).map(String));
  const nc = Math.max(hd.length, ...rows.map(r => r.length), 1), fs = 17;
  const cw = Array.from({ length: nc }, (_, c) => Math.max(56, ...[hd[c] || "", ...rows.map(r => r[c] || "")].map(t => tw(t, fs) + 24)));
  const rh = 42, W = cw.reduce((a, b) => a + b, 0) + 4, hl = new Set(arr(s.highlight, []).map(p => p[0] + "," + p[1]));
  let b = "", y = 2;
  const row = (cells, isH, ri) => { let x = 2; for (let c = 0; c < nc; c++) { const key = ri + "," + c; const fill = isH ? FC.blue : hl.has(key) ? FC.pale[1] : (s.rowHeaders && c === 0 ? FC.pale[0] : "#fff");
    b += `<rect x="${x}" y="${y}" width="${cw[c]}" height="${rh}" fill="${fill}" stroke="${FC.ink}" stroke-width="2"/>` + txt(x + cw[c] / 2, y + rh / 2, cells[c] || "", { fs, b: isH || (s.rowHeaders && c === 0), c: isH ? "#fff" : FC.ink }); x += cw[c]; } y += rh; };
  if (hd.length) row(hd, true, -1); rows.forEach((r, i) => row(r, false, i));
  return wrap(W + 2, y + 2, b, s.title);
}
/* 3. Đồ thị / đường đi */
function figGraph(s) {
  const nodes = arr(s.nodes, []).map(n => ({ id: String(n.id), x: num(n.x, 0), y: num(n.y, 0), label: n.label })), by = Object.fromEntries(nodes.map(n => [n.id, n]));
  const sc = 70, pad = 40, R = 20;
  const minx = Math.min(...nodes.map(n => n.x)), miny = Math.min(...nodes.map(n => n.y));
  const P = (n) => [pad + (n.x - minx) * sc, pad + (n.y - miny) * sc];
  const W = Math.max(...nodes.map(n => P(n)[0])) + pad, H = Math.max(...nodes.map(n => P(n)[1])) + pad;
  const hp = arr(s.highlight, []).map(String), hset = new Set(); for (let i = 0; i + 1 < hp.length; i++) hset.add(hp[i] + ">" + hp[i + 1]), hset.add(hp[i + 1] + ">" + hp[i]);
  let e = "", n = "";
  const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${FC.ink}"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${FC.red}"/></marker></defs>`;
  arr(s.edges, []).forEach(ed => { const a = by[ed.from], b = by[ed.to]; if (!a || !b) return; const [x1, y1] = P(a), [x2, y2] = P(b); const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const on = hset.has(ed.from + ">" + ed.to); const col = on ? FC.red : FC.ink; const ex = x2 - dx / L * (R + (ed.dir ? 4 : 0)), ey = y2 - dy / L * (R + (ed.dir ? 4 : 0)), sx = x1 + dx / L * R, sy = y1 + dy / L * R;
    e += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="${on ? 5 : 2.5}" stroke-linecap="round" ${ed.dir ? `marker-end="url(#${on ? "ahr" : "ah"})"` : ""}/>`;
    if (ed.label != null && ed.label !== "") { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = tw(ed.label, 14) + 8; e += `<rect x="${mx - w / 2}" y="${my - 11}" width="${w}" height="22" rx="6" fill="#fff" stroke="${col}" stroke-width="1.5"/>` + txt(mx, my, ed.label, { fs: 14, b: 1, c: col }); } });
  nodes.forEach((nd, i) => { const [x, y] = P(nd); const on = hp.includes(nd.id); n += `<circle cx="${x}" cy="${y}" r="${R}" fill="${on ? FC.pale[1] : FC.pale[0]}" stroke="${on ? FC.red : FC.ink}" stroke-width="2.5"/>` + txt(x, y, nd.label != null ? nd.label : nd.id, { fs: 16, b: 1 }); });
  return wrap(W, H, defs + e + n, s.title);
}
/* 4. Que tính */
const SEG = { 0: "abcdef", 1: "bc", 2: "abdeg", 3: "abcdg", 4: "bcfg", 5: "acdfg", 6: "acdefg", 7: "abc", 8: "abcdefg", 9: "abcdfg" };

const loadJs=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Không tải được thư viện tạo PowerPoint. Kiểm tra mạng rồi thử lại nhé."));document.head.appendChild(s)});

function dlBlob(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
ACT.dlppt=async(d,b)=>{const old=b.textContent;b.disabled=true;b.textContent="Đang tạo…";

  const vs=L.slides.map(s=>({...s,visual:visualOf(s)}));
  const buf=await buildPptx(PptxGenJS,JSZip,vs,STY,{logo:LOGO,title:l.title},async u=>u.startsWith("data:image/svg")?await svgToPng(u):u);
  dlBlob((l.title.replace(/[^\p{L}\p{N}]+/gu,"_")||"bai-giang")+".pptx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"}));toast("Đã tạo file PowerPoint. Bấm chuột trong PowerPoint để các bước hiện lần lượt.")}

function qsInfo(L){LESSON=L;STY=(L.form&&L.form.sty)||"sang";const out=[];L.slides.forEach((s,i)=>{const it=interactiveOf(i);if(!it||(it.kind==="mc"&&it.correct==null))return;
  const t=String(s.problem||s.title||"Câu "+(out.length+1)).replace(/\s+/g," ").trim().slice(0,90);
  const a=it.kind==="mc"?qLet(it.correct)+(/^[A-E]$/.test(String(it.opts[it.correct]).trim())?"":". "+String(it.opts[it.correct]).replace(/\s+/g," ").slice(0,40)):String(it.answer).replace(/\s+/g," ").slice(0,60);
  out.push({i,kind:it.kind,n:it.kind==="mc"?it.opts.length:0,time:qClamp(s.time||30),t,a})});return out}
function qRows(q,pl){const rows=Object.values(pl||{}).map(p=>{const an=p.ans||{};let ms=0,ok=0,n=0;Object.values(an).forEach(x=>{n++;ms+=x.ms||0;if(x.ok)ok++});return{id:p.id,name:p.name||"?",score:p.score||0,ok,n,ms,ans:an}});
 rows.sort((a,b)=>b.score-a.score||a.ms-b.ms||a.name.localeCompare(b.name));rows.forEach((r,i)=>r.rank=i+1);return rows}

 if(q.status==="q"){const on=qOn(q);if(now-q.t0>=q.dur*1000||(on.length&&now-q.t0>800&&on.every(p=>p.ans&&p.ans[q.qi]))){qReveal();return}}

function qxData(q,pl){const rows=qRows(q,pl),Q=q.qs.length;
 const a1=[["Hạng","Họ tên","Tổng điểm","Số câu đúng","Số câu sai","Không trả lời","Thời gian TB mỗi câu (giây)"]];
 rows.forEach(r=>{const sai=Object.values(r.ans).filter(x=>!x.ok).length;a1.push([r.rank,r.name,r.score,r.ok,sai,Q-r.n,r.n?+(r.ms/r.n/1000).toFixed(1):""])});
 const h2=["Hạng","Họ tên","Tổng điểm"];q.qs.forEach((x,k)=>h2.push(`Câu ${k+1} – Trả lời`,`Câu ${k+1} – Kết quả`,`Câu ${k+1} – Giây`,`Câu ${k+1} – Điểm`));const a2=[h2];
 rows.forEach(r=>{const row=[r.rank,r.name,r.score];q.qs.forEach((x,k)=>{const an=r.ans[k];if(!an)row.push("","Không trả lời","","0");else row.push(x.kind==="mc"?qLet(an.v):String(an.v),an.ok?"Đúng":"Sai",+(an.ms/1000).toFixed(1),an.pts||0)});a2.push(row)});

 q.qs.forEach((x,k)=>{const an=rows.map(r=>r.ans[k]).filter(Boolean),ok=an.filter(z=>z.ok).length;a3.push([k+1,x.t,x.a,x.time,an.length,ok,an.length?Math.round(ok/an.length*100):"",an.length?+(an.reduce((s,z)=>s+z.ms,0)/an.length/1000).toFixed(1):""])});
 return{a1,a2,a3}}

  XLSX.utils.book_append_sheet(wb,mk(a1,[7,26,12,12,12,13,24]),"Xếp hạng");XLSX.utils.book_append_sheet(wb,mk(a2,[7,26,11].concat(q.qs.flatMap(()=>[14,13,10,9]))),"Chi tiết từng câu");XLSX.utils.book_append_sheet(wb,mk(a3,[6,60,20,14,12,12,12,16]),"Thống kê câu hỏi");
  dlBlob(name+".xlsx",new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));toast("Đã tạo file Excel.")}
 catch(e){const csv="﻿"+a2.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");dl(name+".csv",csv,"text/csv;charset=utf-8");toast("Không tải được thư viện Excel nên Win xuất file .csv (mở bằng Excel được).")}

const avgOf=l=>l.length?l.reduce((x,y)=>x+y,0)/l.length:null;
const cut=(t,n)=>{t=String(t||"");return t.length>n?t.slice(0,n-1)+"…":t};

/* Biểu đồ cột SVG: items=[{l,v:[..],m?,t?}], cols = màu từng chuỗi */
function colChart(items,cols){const W=Math.max(520,items.length*64+50),H=236,pl=30,pb=54,pt=16,iw=W-pl-8,ih=H-pb-pt,gw=iw/Math.max(1,items.length);
 const y=v=>pt+ih*(1-Math.max(0,Math.min(100,v))/100);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;max-width:${Math.round(W*1.25)}px;height:auto;display:block;margin:0 auto" role="img">`;
 [0,50,100].forEach(g=>{s+=`<line x1="${pl}" x2="${W-8}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--bd)"/><text x="${pl-5}" y="${y(g)+4}" font-size="10" text-anchor="end" style="fill:var(--mu)">${g}</text>`});
 items.forEach((it,i)=>{const cx=pl+gw*i+gw/2,n=it.v.length,bw=Math.min(30,gw/(n+.6));
  it.v.forEach((v,k)=>{if(v==null)return;const x=cx-n*bw/2+k*bw,yy=y(v);s+=`<rect x="${x+1}" y="${yy}" width="${bw-2}" height="${Math.max(1,y(0)-yy)}" rx="3" style="fill:${cols[k]}"/>`;if(bw>=15)s+=`<text x="${x+bw/2}" y="${yy-3}" font-size="9" text-anchor="middle" style="fill:var(--tx)">${Math.round(v)}</text>`});
  if(it.m!=null)s+=`<line x1="${cx-gw*.42}" x2="${cx+gw*.42}" y1="${y(it.m)}" y2="${y(it.m)}" style="stroke:var(--no)" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<text x="${cx}" y="${H-pb+14}" font-size="10" text-anchor="middle" style="fill:var(--tx)"><title>${esc(it.t||it.l)}</title>${esc(cut(it.l,gw<70?9:13))}</text>`});
 return s+"</svg>"}
const legend=(a)=>`<div class="row" style="gap:14px;margin:4px 0 2px">${a.map(x=>`<span class="note"><i style="display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;${x[2]?"background:none;border-top:2px dashed "+x[1]+";height:0":"background:"+x[1]}"></i>${x[0]}</span>`).join("")}</div>`;
const hbar=(v,c)=>`<div class="bar" style="width:100%;min-width:60px"><i style="width:${Math.max(0,Math.min(100,v||0))}%;background:${c||"var(--pr)"}"></i></div>`;

/* Chỉ số học tập của 1 học sinh trên các bài A (đã sắp theo ngày giao) */
function rpMetrics(S,A,R){
 const per=A.map(a=>{const r=(R[a.id]||{})[S.id]||null;return{a,r,sc:r&&r.maxScore?r.score/r.maxScore*100:null,learn:r?(r.pct||0):0,done:!!(r&&r.completedAt),acc:r&&r.qTotal?r.qOk/r.qTotal*100:null}});
 const st=per.filter(p=>p.r),sc=per.filter(p=>p.sc!=null);let qOk=0,qT=0,ms=0,tries=0,qn=0,gave=0;
 st.forEach(p=>{qOk+=p.r.qOk||0;qT+=p.r.qTotal||0;ms+=p.r.totalMs||0;Object.values(p.r.slides||{}).forEach(s=>{if(s&&s.q){qn++;tries+=s.tries||0;if(s.gave)gave++}})});
 let trend=null;if(sc.length>=4){const h=Math.floor(sc.length/2),d=avgOf(sc.slice(h).map(p=>p.sc))-avgOf(sc.slice(0,h).map(p=>p.sc));trend=d>=10?1:d<=-10?-1:0}
 return{S,per,nA:per.length,nStart:st.length,nDone:per.filter(p=>p.done).length,learn:per.length?avgOf(per.map(p=>p.learn)):0,score:avgOf(sc.map(p=>p.sc)),acc:qT?qOk/qT*100:null,qOk,qT,ms,msPerQ:qT?ms/qT:null,tries:qn?tries/qn:null,gave,trend}}

/* Khung nhận xét tự động (theo quy tắc từ số liệu học tập – giáo viên chỉnh sửa trước khi gửi) */
function autoComment(m,ctx){const n=given(m.S.name),out=[];
 out.push(`Trong ${ctx.label} (${m.nA} bài), em ${n} đã hoàn thành ${m.nDone}/${m.nA} bài, trung bình học ${pc(m.learn)} nội dung`+(m.score!=null?` và đạt ${pc(m.score)} số điểm ở các câu hỏi (${m.qOk}/${m.qT} câu đúng).`:"."));
 if(!m.nStart){out.push(`Em chưa bắt đầu làm bài nào trong giai đoạn này. Mong phụ huynh nhắc em vào học đều đặn để theo kịp lớp.`);return out.join(" ")}
 const s=m.score;
 if(s!=null){out.push(s>=85?"Kết quả rất tốt: em nắm vững kiến thức và làm bài chắc chắn.":s>=70?"Kết quả khá tốt, em hiểu bài và làm đúng phần lớn các câu.":s>=50?"Kết quả ở mức trung bình khá: em hiểu bài nhưng còn nhầm lẫn ở một số câu.":"Em còn nhiều chỗ chưa vững, cần được ôn lại kiến thức và làm thêm bài tập cơ bản.")}
 const sc=m.per.filter(p=>p.sc!=null&&p.done).sort((a,b)=>b.sc-a.sc);
 if(sc.length>=2){const b=sc[0],w=sc[sc.length-1];if(b.sc>=70)out.push(`Em làm tốt nhất ở bài “${cut(b.a.title,50)}” (${pc(b.sc)}).`);if(w.sc<70&&w.a.id!==b.a.id)out.push(`Cần ôn thêm bài “${cut(w.a.title,50)}” (${pc(w.sc)}).`)}
 const miss=m.per.filter(p=>!p.done);if(miss.length){out.push(`Em chưa hoàn thành ${miss.length} bài${miss.length<=3?": "+miss.map(p=>"“"+cut(p.a.title,40)+"”").join(", "):""}; mong phụ huynh nhắc em hoàn thành.`)}
 if(m.tries!=null&&m.tries>=1.6)out.push("Em thường phải thử nhiều lần mới ra đáp án đúng – nên đọc kỹ đề và suy nghĩ trước khi chọn.");
 if(m.gave>0)out.push(`Có ${m.gave} câu em chọn xem lời giải; nên tự suy nghĩ thêm một lúc trước khi xem.`);
 if(m.msPerQ&&ctx.msPerQ){if(m.msPerQ>ctx.msPerQ*1.6)out.push("Em làm bài khá chậm so với mặt bằng lớp; có thể luyện thêm tốc độ với các bài quen thuộc.");else if(m.msPerQ<ctx.msPerQ*.6&&m.acc!=null&&m.acc<70)out.push("Em làm rất nhanh nhưng độ chính xác chưa cao – nên chậm lại và kiểm tra kỹ trước khi trả lời.")}
 if(m.trend===1)out.push("Điểm số của em đang tiến bộ rõ rệt so với các bài đầu – rất đáng khen!");else if(m.trend===-1)out.push("Điểm số các bài gần đây thấp hơn các bài đầu; phụ huynh nên động viên và hỏi xem em gặp khó khăn ở phần nào.");
 if(ctx.avgScore!=null&&s!=null)out.push(s>=ctx.avgScore+8?"So với trung bình lớp, em đang ở nhóm trên.":s<=ctx.avgScore-8?"So với trung bình lớp, em đang thấp hơn một chút và cần được hỗ trợ thêm.":"So với trung bình lớp, em ở mức tương đương.");
 return out.join(" ")}

/* Nội dung email báo cáo (chữ thuần, có thanh ██░░ thay biểu đồ) */
const durTxt=ms=>{const m=Math.round((ms||0)/60000);return m<1?"dưới 1 phút":m<60?m+" phút":Math.floor(m/60)+" giờ "+(m%60)+" phút"};
const tbar=v=>{const k=Math.max(0,Math.min(10,Math.round((v||0)/10)));return "█".repeat(k)+"░".repeat(10-k)};
function rpEmail(m,ctx,cmt,note){const L=[`Kính gửi phụ huynh em ${m.S.name},`,"",`${brand()} xin gửi báo cáo học tập của em ${given(m.S.name)} – ${ctx.label}${ctx.range?" ("+ctx.range+")":""}.`,"","TỔNG QUAN",
 `• Hoàn thành: ${m.nDone}/${m.nA} bài`,`• Đã học trung bình: ${pc(m.learn)} nội dung`,`• Điểm trung bình: ${pc(m.score)}${ctx.avgScore!=null?" (trung bình lớp "+pc(ctx.avgScore)+")":""}`,`• Câu đúng: ${m.qOk}/${m.qT}`,`• Tổng thời gian học: ${durTxt(m.ms)}`,"","KẾT QUẢ TỪNG BÀI"];
 m.per.forEach((p,i)=>L.push(`${i+1}. ${cut(p.a.title,45)}`,"    "+(p.sc!=null?tbar(p.sc)+" "+pc(p.sc)+(p.done?"":" (chưa xong)"):"░░░░░░░░░░ chưa làm")));
 L.push("","NHẬN XÉT",cmt.trim());if(note&&note.trim())L.push("","LƯU Ý RIÊNG TỪ GIÁO VIÊN",note.trim());L.push("","Trân trọng,",signer());return L.join("\n")}

 $("rc").onchange=e=>{RP.cid=e.target.value;RP.data=null;tabBao()};$("rp").onchange=e=>{RP.per=e.target.value;rpExtra()};$("rn").oninput=e=>RP.name=e.target.value;$("rgo").onclick=rpRun;rpExtra();if(RP.data&&RP.data.cid===RP.cid)rpRender()}
function rpExtra(){const e=$("rx");if(!e)return;
 if(RP.per==="topic")e.innerHTML=RP.as.length?`<label class="l">Chọn các bài thuộc chuyên đề</label><div style="max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:11px;padding:8px">${RP.as.map(a=>`<label style="display:flex;gap:8px;align-items:center;padding:3px 0"><input type="checkbox" style="width:auto" data-rsel="${a.id}" ${RP.sel[a.id]?"checked":""}> ${esc(a.title)} <span class="note">${fmtDay(a.createdAt)}</span></label>`).join("")}</div>`:'<p class="note">Lớp chưa có bài nào.</p>';
 else if(RP.per==="custom")e.innerHTML=`<div class="row"><div class="grow"><label class="l">Từ ngày</label><input type="date" id="rf" value="${RP.from}"></div><div class="grow"><label class="l">Đến ngày</label><input type="date" id="rt" value="${RP.to}"></div></div>`;
 else e.innerHTML="";

function rpPick(){const p=PERS.find(x=>x[0]===RP.per);let A=RP.as,label=p[1];

 else if(RP.per==="custom"){const f=RP.from?new Date(RP.from+"T00:00:00").getTime():0,t=RP.to?new Date(RP.to+"T23:59:59").getTime():Date.now();A=A.filter(a=>a.createdAt>=f&&a.createdAt<=t);label="giai đoạn "+(RP.from?fmtDay(f):"đầu")+" – "+(RP.to?fmtDay(t):"nay")}
 else if(p[2]){const f=Date.now()-p[2]*864e5;A=A.filter(a=>a.createdAt>=f)}

async function rpRun(){const {A,label}=rpPick(),o=$("rout");if(!A.length){o.innerHTML='<div class="panel">Chưa có bài nào được giao trong kỳ này. Thầy/cô đổi kỳ báo cáo hoặc chọn bài khác nhé.</div>';return}
 o.innerHTML='<p class="note">Đang tổng hợp kết quả…</p>';
 try{const [stu,notes,res]=await Promise.all([classStudents(RP.cid),DB.list("notes",[["teacherId","==",UID]]).catch(()=>[]),Promise.all(A.map(a=>DB.list(`assignments/${a.id}/results`).catch(()=>[])))]);
  const R={};A.forEach((a,i)=>{R[a.id]={};res[i].forEach(r=>R[a.id][r.id]=r)});const N={};notes.forEach(n=>N[n.id]=n);
  const M=stu.map(s=>rpMetrics(s,A,R)),tm=M.reduce((x,m)=>x+m.ms,0),tq=M.reduce((x,m)=>x+m.qT,0),sc=M.filter(m=>m.score!=null).map(m=>m.score);
  const ts=A.map(a=>a.createdAt),range=fmtDay(Math.min(...ts))+" – "+fmtDay(Math.max(...ts));
  RP.data={cid:RP.cid,A,R,M,N,stu,ctx:{label,range,msPerQ:tq?tm/tq:null,avgScore:avgOf(sc)}};RP.cmt={};rpRender()}catch(e){o.innerHTML='<div class="panel">Chưa tải được: '+esc(authErr(e))+'</div>'}}
const needFlags=(m,n)=>{const f=[];if(m.nStart===0)f.push("chưa làm bài nào");else{if(m.score!=null&&m.score<50)f.push("điểm thấp");if(m.nStart<m.nA*.5)f.push("bỏ nhiều bài");if(m.trend===-1)f.push("đang sa sút")}if(n&&n.text)f.push("📝 có ghi chú");return f};

 <h3 style="margin:14px 0 2px;font-size:16px">Kết quả theo từng bài (cả lớp)</h3>${legend([["Điểm trung bình các câu hỏi (%)","var(--pr)"],["% nội dung đã học","var(--mu)"]])}<div style="overflow:auto">${colChart(items,["var(--pr)","var(--mu)"])}</div></div>

async function rsCharts(a,rows){const box=$("rch");if(!box)return;const R=rows.filter(x=>x.r&&!x.g).map(x=>x.r);if(!R.length){box.innerHTML="";return}
 let L=null;try{L=await loadLesson(a.lessonId)}catch(e){}
 const sc=R.filter(r=>r.maxScore).map(r=>r.score/r.maxScore*100),bins=[["85–100%",x=>x>=85,"var(--ok)"],["70–84%",x=>x>=70&&x<85,"var(--pr)"],["50–69%",x=>x>=50&&x<70,"var(--wa)"],["dưới 50%",x=>x<50,"var(--no)"]];
 const nQ={},ok={},tr={};R.forEach(r=>Object.entries(r.slides||{}).forEach(([i,s])=>{if(!s||!s.q)return;if(!(s.tries>0||s.ok||s.gave))return;nQ[i]=(nQ[i]||0)+1;if(s.ok)ok[i]=(ok[i]||0)+1;tr[i]=(tr[i]||0)+(s.tries||0)}));
 const ids=Object.keys(nQ).map(Number).sort((x,y)=>x-y),rate=i=>(ok[i]||0)/nQ[i]*100,ttl=i=>{const s=L&&L.slides[i];return s?(s.title||s.problem||"").toString().replace(/\s+/g," ").slice(0,70):""};
 const items=ids.map((i,k)=>({l:"Câu "+(k+1),t:"Câu "+(k+1)+" (slide "+(i+1)+") "+ttl(i),v:[rate(i)]})),hard=ids.map((i,k)=>({i,k,r:rate(i)})).filter(x=>x.r<70).sort((x,y)=>x.r-y.r).slice(0,3);
 box.innerHTML=`<div class="panel"><h2>📊 Biểu đồ bài này</h2><div class="row" style="align-items:flex-start;gap:24px"><div style="flex:1;min-width:240px"><b>Phân bố điểm của lớp</b><div style="margin-top:8px">${bins.map(b=>{const n=sc.filter(b[1]).length;return`<div class="row" style="flex-wrap:nowrap;margin:5px 0"><span style="width:78px;font-size:13px">${b[0]}</span><div style="flex:1">${hbar(sc.length?n/sc.length*100:0,b[2])}</div><b style="width:34px;text-align:right">${n}</b></div>`}).join("")}</div><p class="note">${sc.length} em đã làm · điểm TB ${pc(avgOf(sc))}</p></div>
 <div style="flex:2;min-width:300px"><b>Tỉ lệ làm đúng từng câu</b>${items.length?`<div style="overflow:auto">${colChart(items,["var(--ok)"])}</div>`:'<p class="note">Bài này chưa có câu hỏi hoặc chưa có em nào làm.</p>'}${hard.length?`<p style="margin:6px 0 0"><b>Câu nhiều bạn làm sai nhất:</b> ${hard.map(x=>`câu ${x.k+1} (slide ${x.i+1}, ${Math.round(x.r)}% đúng${ttl(x.i)?" – “"+esc(cut(ttl(x.i),40))+"”":""})`).join("; ")}.</p>`:""}</div></div></div>`}

function updHead(){if(!P)return;const S=stats(),e=$("phd");if(e)e.innerHTML=`<button data-act="pexit">← Thoát</button><b style="flex:none">${esc(P.a.title)}</b><div class="bar pb"><i style="width:${S.pct}%"></i></div><span class="dw">${S.pct}% đã học</span><span class="dw">Điểm ${S.score}/${S.maxScore}</span>${P.live&&P.call?`<span class="chip wa">🙋 ${esc(P.call.uid===UID?"Cô gọi em lên bảng!":P.call.name+" đang lên bảng")}</span>`:""}`}
function updDw(){const e=$("pdw");if(!e||!P)return;const s=P.sl[P.cur];e.textContent=s.seen?"✓ Đã học":"⏱ Còn "+Math.max(0,Math.ceil((SEEN_MS-s.ms)/1000))+"s để tính là đã học"}
function draw(){const o=$("pl");if(!o||!P)return;const s=P.sl[P.cur],it=s.it,solved=s.ok||s.gave;const last=P.cur===P.n-1;
 let ctl="";if(it&&!solved){if(it.kind==="mc")ctl=`<div class="opts" style="--n:${it.opts.length}">${it.opts.map((x,i)=>`<button class="o${i}${s.wrong.includes(i)?" x":""}" data-act="pick" data-i="${i}" ${s.wrong.includes(i)?"disabled":""}>${String.fromCharCode(65+i)}</button>`).join("")}</div>`;
  else ctl=`<div class="row" style="flex-wrap:nowrap"><input id="pans" placeholder="Nhập đáp án của em…" autocomplete="off" style="font-size:20px"><button data-act="psend">Gửi</button></div>`;
  if(s.tries>=2)ctl+=`<div style="text-align:center"><button class="sec sm" data-act="pgive" style="color:#fff;border-color:#fff8">Xem lời giải (không tính điểm)</button></div>`}
 if(P.live&&P.wait){o.innerHTML=`<div class="hd" id="phd"></div><div class="stage"><div style="text-align:center;padding:24px"><div style="font-size:54px">${P.over?"👋":"⏳"}</div><h2 style="color:#fff">${P.over?"Buổi học đã kết thúc":"Đang chờ cô bắt đầu…"}</h2><p class="note" style="color:#cbd5e1">${P.over?"Em bấm Thoát để về trang chính.":"Cô chiếu là slide tự hiện ra, em cứ để màn hình này nhé."}</p></div></div>`;updHead();return}
 o.innerHTML=`<div class="hd" id="phd"></div><div class="stage"><div class="slw"><div class="sld" id="psl">${slideHtml(P.cur,P.st)}</div><svg id="ink" viewBox="0 0 1600 900" preserveAspectRatio="none"></svg></div></div><div class="ft">${P.live&&P.canDraw?'<div class="tb" id="stb"></div>':""}${ctl}<div class="msgl ${P.msgc||""}" id="pmsg">${esc(P.msg||"")}</div>
 ${P.live?`<div class="nav"><button id="phb" class="${P.hand?"go":""}" data-act="phand">${P.hand?"✋ Đang giơ tay · bấm để hạ":"✋ Giơ tay"}</button><span class="dw" id="pdw"></span><span class="dw">Slide ${P.cur+1}/${P.n} · cô đang chiếu</span></div>`:`<div class="nav"><button data-act="pprev" ${P.cur===0?"disabled":""}>◀ Trước</button><span class="dw" id="pdw"></span><span class="dw">Slide ${P.cur+1}/${P.n}</span><button class="go" data-act="pnext">${last&&P.st>=clicks(P.cur)?"Hoàn thành ✓":"Tiếp ▶"}</button></div>`}</div>`;
 updHead();updDw();inkTb();inkRender();const inp=$("pans");if(inp){inp.onkeydown=e=>{if(e.key==="Enter")ACT.psend()};inp.focus()}}
function say(m,c){P.msg=m;P.msgc=c||"";const e=$("pmsg");if(e){e.textContent=m;e.className="msgl "+(c||"")}}
function answer(v){const s=P.sl[P.cur],it=s.it;if(!it||s.ok||s.gave)return;s.tries++;P.dirty=true;
 if(it.kind==="mc"&&it.correct==null){s.ok=true;s.pts=0;P.st=clicks(P.cur);P.msg="Đã ghi nhận đáp án của em.";P.msgc="";draw();savePlayer(true);return}
 if(judgeAns(it,v)){s.ok=true;s.pts=ptsOf(s.tries,false);P.st=clicks(P.cur);P.msg="✓ Đúng rồi! +"+s.pts+" điểm";P.msgc="ok";draw();savePlayer(true)}
 else{if(it.kind==="mc"){if(!s.wrong.includes(v))s.wrong.push(v)}else{const w=String(v).slice(0,40);if(!s.wt.includes(w)&&s.wt.length<8)s.wt.push(w)}P.msg="✗ Chưa đúng, em thử lại nhé ("+s.tries+" lần)";P.msgc="no";draw();savePlayer(true)}}
ACT.pick=d=>answer(+d.i);ACT.psend=()=>{const i=$("pans");if(i&&i.value.trim())answer(i.value.trim());else if(i)say("Em nhập đáp án trước nhé.","no")};
ACT.pgive=()=>{const s=P.sl[P.cur];s.gave=true;s.pts=0;P.st=clicks(P.cur);P.msg="Lời giải đã hiện, em xem kỹ nhé.";P.msgc="";P.dirty=true;draw();savePlayer(true)};
function nextStep(){if(!P)return;if(P.st<clicks(P.cur)){P.st++;P.msg="";draw()}else if(P.cur<P.n-1){gotoSlide(P.cur+1)}else{toast("Em đã đến slide cuối.");stopPlayer(false)}}
ACT.pnext=()=>{if(P&&!P.live)nextStep()};ACT.pprev=()=>{if(P&&!P.live)prevSlide()};
function prevSlide(){if(P&&P.cur>0)gotoSlide(P.cur-1)}
function gotoSlide(i){P.cur=i;const s=P.sl[i];P.st=(s.ok||s.gave)?clicks(i):0;P.msg="";P.msgc="";P.dirty=true;draw();savePlayer(true)}
