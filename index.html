<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>Lớp Toán tư duy cô Oanh – Lớp học</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Be Vietnam Pro',Arial,sans-serif;font-size:16px;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px}.narrow{max-width:440px;padding-top:40px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 10px}p.sub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;background:var(--pr);color:#fff}
button.sec{background:transparent;color:var(--pr);border:2px solid var(--pr);padding:8px 14px}
button.red{background:transparent;color:var(--no);border:2px solid var(--no);padding:6px 12px}button.sm{padding:6px 12px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx)}
textarea{min-height:110px}label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:var(--mu)}.grow{flex:1}
.hide{display:none!important}a.lk{color:var(--pr);cursor:pointer;font-weight:700}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top img{height:38px;width:38px;border-radius:50%}.top b{font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;color:var(--tx);border:2px solid transparent;padding:7px 14px}
.tabs button.on{border-color:var(--pr);color:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:13px;color:var(--mu);font-weight:700;white-space:nowrap}td.n,th.n{text-align:right}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bd)}
.chip.ok{background:#1e9e5528;color:var(--ok)}.chip.no{background:#d6454528;color:var(--no)}.chip.wa{background:#c98a0028;color:var(--wa)}.chip.pr{background:#1f6feb28;color:var(--pr)}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--pr)}.bar.ok i{background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.ov .box{background:var(--card);border-radius:16px;padding:18px;width:min(720px,100%);border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111c;color:#fff;border-radius:12px;padding:10px 16px;z-index:99;display:none;max-width:90vw}
/* slide */
.sld{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;font-family:Arial,sans-serif}
.sld>*{position:absolute;box-sizing:border-box;display:flex;overflow:hidden;line-height:1.22;white-space:pre-wrap;word-break:break-word;transition:opacity .35s}
.sld>img{display:block;object-fit:contain}.sld .h{opacity:0;pointer-events:none}.sld .fb{display:none}

#pl{position:fixed;inset:0;display:flex;flex-direction:column;background:#0b1020;color:#fff;z-index:20}

#pl .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.slw{position:relative;width:min(100cqw,177.78cqh)}
.slw .sld{width:100%;border-radius:8px;background:#fff}.slw svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.slw svg.on{pointer-events:auto;touch-action:none;cursor:crosshair}
#pl .hd{flex-wrap:wrap}.tb{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:2px 12px 6px;font-size:13px}.tb button{padding:4px 9px;font-size:14px;background:#ffffff22;color:#fff;border:1px solid #ffffff33;border-radius:8px}.tb button.on{background:#2563eb;border-color:#93c5fd}.tb button:disabled{opacity:.35}
.tb .cd{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff6}.tb .cd.on{border-color:#fff;box-shadow:0 0 0 2px #2563eb}.tb .sep{width:1px;height:22px;background:#fff4;margin:0 3px}
#sp{position:absolute;top:52px;right:0;bottom:0;width:310px;max-width:92vw;background:#111a33;border-left:1px solid #fff3;z-index:5;display:flex;flex-direction:column;overflow:hidden}
#sp .sph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #fff2}#sp .spb{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #fff2}
#sp .spl{flex:1;overflow:auto;padding:6px 8px}.srow{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid #fff1;font-size:14px}.srow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sm{padding:3px 7px;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex:none}.dot.on{background:#22c55e}
#rname{font-size:20px;text-align:center;min-height:28px;color:#fde68a}.callbox{margin:8px 12px;padding:10px;border-radius:12px;background:#1e3a8a;display:flex;flex-direction:column;gap:6px;font-size:14px}
#pl.host .hd{padding:4px 10px;gap:6px}#pl.host .hd .tb{display:contents}#pl.host .ft{min-height:0;padding:4px 10px;flex-direction:row;align-items:center;gap:10px}#pl.host .hst{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pl.host .ft .nav{display:contents}#pl.host .ft .dw{display:none}.slw svg.nv{cursor:default}
#ovw{position:absolute;inset:0;background:#0b1020f5;z-index:6;overflow:auto;padding:10px 14px}#ovw .oh{display:flex;align-items:center;gap:12px;margin-bottom:10px;position:sticky;top:0;background:#0b1020;padding:4px 0}
#ovw .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.th{position:relative;cursor:pointer;border:3px solid transparent;border-radius:12px;background:#1e293b;padding:4px}.th:hover{border-color:#93c5fd}.th.cur{border-color:#f59e0b}
.th .sld{width:100%;pointer-events:none;border-radius:6px}.th .no{background:#334155;color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}.th .bd{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;padding:4px 2px 0;color:#cbd5e1;min-height:22px}.th.vis .no{background:#16a34a}
#printroot{display:none}

#pl .ft{padding:8px 12px;display:flex;flex-direction:column;gap:8px;min-height:92px;justify-content:center}

.opts{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}
.opts button{font-size:22px;min-height:52px;border-radius:12px;color:#fff}
.o0{background:#2f80ed}.o1{background:#f2a900}.o2{background:#27ae60}.o3{background:#eb5757}.o4{background:#9b51e0}.opts button.x{opacity:.3}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nav button{background:#ffffff22}.nav button.go{background:var(--pr)}
.msgl{text-align:center;font-weight:700;min-height:22px}.msgl.ok{color:#58e08f}.msgl.no{color:#ff8585}
.dw{font-size:13px;opacity:.85;white-space:nowrap}

<script>
/* ====== Thư viện hình toán (vẽ bằng mã, không cần AI tự viết SVG) ====== */
const FC = { ink: "#183F69", blue: "#2F80ED", yellow: "#F2A900", green: "#27AE60", red: "#EB5757", purple: "#9B51E0", pale: ["#E3EEFF", "#FFF1C1", "#E2F0CB", "#FDE2E4", "#E8DAEF"], wood: "#F2B84B", head: "#E4572E" };
const fx = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tw = (t, fs) => String(t).length * fs * 0.58 + 6;
const txt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="${o.fs || 16}" font-weight="${o.b ? 700 : 400}" fill="${o.c || FC.ink}" text-anchor="${o.a || "middle"}" dominant-baseline="${o.v || "central"}">${fx(t)}</text>`;
const wrap = (w, h, body, title) => ({ w, h: h + (title ? 34 : 0), svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + (title ? 34 : 0)}" width="${w}" height="${h + (title ? 34 : 0)}"><rect width="100%" height="100%" fill="#fff"/>${title ? txt(w / 2, 18, title, { fs: 16, b: 1 }) : ""}<g transform="translate(0 ${title ? 34 : 0})">${body}</g></svg>` });
const arr = (v, d) => (Array.isArray(v) ? v : d);
const num = (v, d) => (isFinite(+v) && v !== "" && v !== null ? +v : d);

/* 1. Sơ đồ cây */
function figTree(s) {
  const lv = arr(s.levels, null);
  const build = (d) => (!lv || d >= lv.length ? [] : arr(lv[d].items, []).map(it => ({ label: String(it), children: build(d + 1) })));
  const root = lv ? { label: String(s.root || "Bắt đầu"), children: build(0) } : { label: String(s.root || ""), children: arr(s.children, []) };
  let leaf = 0, maxD = 0, maxL = 0;
  const walk = (n, d) => { n.d = d; maxD = Math.max(maxD, d); maxL = Math.max(maxL, String(n.label).length); const ch = arr(n.children, []); n.children = ch; if (!ch.length) n.y = leaf++; else { ch.forEach(c => walk(c, d + 1)); n.y = (ch[0].y + ch[ch.length - 1].y) / 2; } };
  walk(root, 0);
  const nw = Math.min(150, Math.max(64, maxL * 10 + 24)), nh = 32, cw = nw + 56, rh = 44, top = lv ? 30 : 10;
  const W = (maxD + 1) * cw - 56 + 20, H = leaf * rh + top + 10;
  let e = "", n = "";
  const X = (d) => 10 + d * cw, Y = (y) => top + y * rh + nh / 2 + 2;
  const draw = (nd) => { nd.children.forEach(c => { const x1 = X(nd.d) + nw, y1 = Y(nd.y), x2 = X(c.d), y2 = Y(c.y); e += `<path d="M${x1} ${y1} C${x1 + 28} ${y1} ${x2 - 28} ${y2} ${x2} ${y2}" fill="none" stroke="${FC.ink}" stroke-width="2"/>`; draw(c); });
    const col = nd.d === 0 ? FC.pale[1] : FC.pale[(nd.d - 1) % 3 === 0 ? 0 : (nd.d - 1) % 3 === 1 ? 2 : 3];
    n += `<rect x="${X(nd.d)}" y="${Y(nd.y) - nh / 2}" width="${nw}" height="${nh}" rx="${nh / 2}" fill="${col}" stroke="${FC.ink}" stroke-width="2"/>` + txt(X(nd.d) + nw / 2, Y(nd.y), nd.label, { fs: 15, b: 1 }); };
  draw(root);
  let cap = "";
  if (lv) lv.forEach((l, i) => { if (l.name) cap += txt(X(i + 1) + nw / 2, 12, l.name, { fs: 13, c: FC.blue, b: 1 }); });
  let extra = "", H2 = H;
  if (s.count && leaf) { extra = txt(W / 2, H + 14, `Có tất cả ${leaf} cách`, { fs: 16, b: 1, c: FC.red }); H2 = H + 30; }
  return wrap(W, H2, cap + e + n + extra, s.title);
}
/* 2. Bảng */
function figTable(s) {
  const hd = arr(s.headers, []).map(String), rows = arr(s.rows, []).map(r => arr(r, []).map(String));
  const nc = Math.max(hd.length, ...rows.map(r => r.length), 1), fs = 17;
  const cw = Array.from({ length: nc }, (_, c) => Math.max(56, ...[hd[c] || "", ...rows.map(r => r[c] || "")].map(t => tw(t, fs) + 24)));
  const rh = 42, W = cw.reduce((a, b) => a + b, 0) + 4, hl = new Set(arr(s.highlight, []).map(p => p[0] + "," + p[1]));
  let b = "", y = 2;
  const row = (cells, isH, ri) => { let x = 2; for (let c = 0; c < nc; c++) { const key = ri + "," + c; const fill = isH ? FC.blue : hl.has(key) ? FC.pale[1] : (s.rowHeaders && c === 0 ? FC.pale[0] : "#fff");
    b += `<rect x="${x}" y="${y}" width="${cw[c]}" height="${rh}" fill="${fill}" stroke="${FC.ink}" stroke-width="2"/>` + txt(x + cw[c] / 2, y + rh / 2, cells[c] || "", { fs, b: isH || (s.rowHeaders && c === 0), c: isH ? "#fff" : FC.ink }); x += cw[c]; } y += rh; };
  if (hd.length) row(hd, true, -1); rows.forEach((r, i) => row(r, false, i));
  return wrap(W + 2, y + 2, b, s.title);
}
/* 3. Đồ thị / đường đi */
function figGraph(s) {
  const nodes = arr(s.nodes, []).map(n => ({ id: String(n.id), x: num(n.x, 0), y: num(n.y, 0), label: n.label })), by = Object.fromEntries(nodes.map(n => [n.id, n]));
  const sc = 70, pad = 40, R = 20;
  const minx = Math.min(...nodes.map(n => n.x)), miny = Math.min(...nodes.map(n => n.y));
  const P = (n) => [pad + (n.x - minx) * sc, pad + (n.y - miny) * sc];
  const W = Math.max(...nodes.map(n => P(n)[0])) + pad, H = Math.max(...nodes.map(n => P(n)[1])) + pad;
  const hp = arr(s.highlight, []).map(String), hset = new Set(); for (let i = 0; i + 1 < hp.length; i++) hset.add(hp[i] + ">" + hp[i + 1]), hset.add(hp[i + 1] + ">" + hp[i]);
  let e = "", n = "";
  const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${FC.ink}"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${FC.red}"/></marker></defs>`;
  arr(s.edges, []).forEach(ed => { const a = by[ed.from], b = by[ed.to]; if (!a || !b) return; const [x1, y1] = P(a), [x2, y2] = P(b); const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const on = hset.has(ed.from + ">" + ed.to); const col = on ? FC.red : FC.ink; const ex = x2 - dx / L * (R + (ed.dir ? 4 : 0)), ey = y2 - dy / L * (R + (ed.dir ? 4 : 0)), sx = x1 + dx / L * R, sy = y1 + dy / L * R;
    e += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="${on ? 5 : 2.5}" stroke-linecap="round" ${ed.dir ? `marker-end="url(#${on ? "ahr" : "ah"})"` : ""}/>`;
    if (ed.label != null && ed.label !== "") { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = tw(ed.label, 14) + 8; e += `<rect x="${mx - w / 2}" y="${my - 11}" width="${w}" height="22" rx="6" fill="#fff" stroke="${col}" stroke-width="1.5"/>` + txt(mx, my, ed.label, { fs: 14, b: 1, c: col }); } });
  nodes.forEach((nd, i) => { const [x, y] = P(nd); const on = hp.includes(nd.id); n += `<circle cx="${x}" cy="${y}" r="${R}" fill="${on ? FC.pale[1] : FC.pale[0]}" stroke="${on ? FC.red : FC.ink}" stroke-width="2.5"/>` + txt(x, y, nd.label != null ? nd.label : nd.id, { fs: 16, b: 1 }); });
  return wrap(W, H, defs + e + n, s.title);
}
/* 4. Que tính */
const SEG = { 0: "abcdef", 1: "bc", 2: "abdeg", 3: "abcdg", 4: "bcfg", 5: "acdfg", 6: "acdefg", 7: "abc", 8: "abcdefg", 9: "abcdfg" };
function stick(x1, y1, x2, y2, ghost) {
  if (ghost) return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 9"/>`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${FC.wood}" stroke-width="9" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#D99A1E" stroke-width="2" stroke-linecap="round" opacity=".6"/><circle cx="${x1}" cy="${y1}" r="6" fill="${FC.head}"/>`;
}
function figSticks(s) {
  const body = []; const kind = s.kind || (s.rows ? "squares" : "digits");
  if (kind === "squares") {
    const R = Math.max(1, Math.min(6, num(s.rows, 1))), C = Math.max(1, Math.min(8, num(s.cols, 3))), u = 62, o = 24; const gone = new Set(arr(s.removed, []).map(String));
    let k = 0; const mk = (x1, y1, x2, y2) => { const id = "k" + k++; if (!gone.has(String(k - 1))) body.push(stick(x1, y1, x2, y2)); else body.push(stick(x1, y1, x2, y2, true)); };
    for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) mk(o + c * u + 5, o + r * u, o + (c + 1) * u - 5, o + r * u);
    for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) mk(o + c * u, o + r * u + 5, o + c * u, o + (r + 1) * u - 5);
    return wrap(C * u + 2 * o, R * u + 2 * o, body.join(""), s.title);
  }
  const t = String(s.text || "").replace(/\s+/g, ""), ghost = s.ghost !== false; const dw = 58, dh = 92, gap = 22; let x = 20;
  for (const ch of t) {
    if (/\d/.test(ch)) { const on = SEG[ch], ax = x + 8, bx = x + dw - 8, ty = 12, my = 12 + dh / 2, by = 12 + dh;
      const sg = { a: [ax, ty, bx, ty], b: [bx + 4, ty + 6, bx + 4, my - 6], c: [bx + 4, my + 6, bx + 4, by - 6], d: [ax, by, bx, by], e: [ax - 4, my + 6, ax - 4, by - 6], f: [ax - 4, ty + 6, ax - 4, my - 6], g: [ax, my, bx, my] };
      for (const k of "abcdefg") { const p = sg[k]; if (on.includes(k)) body.push(stick(...p)); else if (ghost) body.push(stick(...p, true)); } x += dw + gap; }
    else { const cy = 12 + dh / 2; const cx = x + 22;
      if (ch === "+") { body.push(stick(cx - 18, cy, cx + 18, cy), stick(cx, cy - 18, cx, cy + 18)); }
      else if (ch === "-" || ch === "−") body.push(stick(cx - 18, cy, cx + 18, cy));
      else if (ch === "=") body.push(stick(cx - 18, cy - 12, cx + 18, cy - 12), stick(cx - 18, cy + 12, cx + 18, cy + 12));
      else if (ch === "x" || ch === "×" || ch === "*") body.push(stick(cx - 14, cy - 14, cx + 14, cy + 14), stick(cx + 14, cy - 14, cx - 14, cy + 14));
      else body.push(txt(cx, cy, ch, { fs: 30, b: 1 }));
      x += 44 + gap; }
  }
  return wrap(x, dh + 24, body.join(""), s.title);
}
/* 5. Lưới ô vuông */
function figGrid(s) {
  const R = Math.max(1, Math.min(12, num(s.rows, 4))), C = Math.max(1, Math.min(14, num(s.cols, 4))), u = 50, ox = s.labels ? 30 : 6, oy = s.labels ? 30 : 6;
  const sh = new Map(); arr(s.shade, []).forEach(p => sh.set(p[0] + "," + p[1], FC.pale[1])); arr(s.cells, []).forEach(c => { if (c.color) sh.set(c.r + "," + c.c, c.color); });

<script>

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FB_CFG={"apiKey":"AIzaSyA5rsBYJRyrdKZbrTAbo5XN-AB_urSLlSo","authDomain":"lop-toan-co-oanh.firebaseapp.com","projectId":"lop-toan-co-oanh","storageBucket":"lop-toan-co-oanh.firebasestorage.app","messagingSenderId":"681397017588","appId":"1:681397017588:web:348431d89f1b6cc7d837a1"};
const EMAIL_DOM="hs.lop-co-oanh.app",SEEN_MS=20000,CH=180000;
const LOGO_IMG='<img src="'+LOGO+'" alt="">';
let DB=null,UID=null,ME=null,SIGNUP_BUSY=false,T={tab:"lop",cid:null};
const toEmail=u=>{u=String(u).trim().toLowerCase();return u.includes("@")?u:u+"@"+EMAIL_DOM};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtT=ms=>{ms=Math.round((ms||0)/1000);const m=Math.floor(ms/60),s=ms%60;return m>=60?Math.floor(m/60)+" giờ "+(m%60)+" phút":m+":"+String(s).padStart(2,"0")};
const fmtD=t=>t?new Date(t).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
const fmtDay=t=>t?new Date(t).toLocaleDateString("vi-VN"):"";
const slug=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g,"");
let tt=0;function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",3200)}
function authErr(e){const c=(e&&e.code)||"";
 if(/invalid-credential|user-not-found|wrong-password|invalid-email/.test(c))return "Sai tên đăng nhập hoặc mật khẩu.";
 if(c.includes("email-already-in-use"))return "Tên đăng nhập/email này đã có người dùng.";
 if(c.includes("weak-password"))return "Mật khẩu cần ít nhất 6 ký tự.";
 if(c.includes("network"))return "Mất mạng hoặc mạng đang chặn. Thử lại sau nhé.";
 if(c.includes("too-many"))return "Thử quá nhiều lần. Đợi vài phút rồi thử lại.";
 if(c.includes("permission-denied"))return "Chưa có quyền (luật bảo mật chưa đúng).";
 return "Lỗi: "+(e&&(e.message||e.code)||e)}
function modal(html){const o=document.createElement("div");o.className="ov";o.innerHTML='<div class="box">'+html+'</div>';o.addEventListener("click",e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function closeModal(){document.querySelectorAll(".ov").forEach(o=>o.remove())}
const ACT={};document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b.dataset,b)}});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ===== Firebase adapter ===== */
function fbAdapter(){firebase.initializeApp(FB_CFG);const auth=firebase.auth(),fs=firebase.firestore();let sec=null;
 const q=(p,w)=>{let c=fs.collection(p);(w||[]).forEach(x=>c=c.where(x[0],x[1],x[2]));return c};const dd=s=>({id:s.id,...s.data()});
 return{onAuth:cb=>auth.onAuthStateChanged(u=>cb(u?{uid:u.uid,anon:u.isAnonymous}:null)),signIn:(e,p)=>auth.signInWithEmailAndPassword(e,p),signAnon:()=>auth.signInAnonymously(),
  async resetPw(e,cur,nw){if(!sec)sec=firebase.initializeApp(FB_CFG,"sec");const a=sec.auth();const c=await a.signInWithEmailAndPassword(e,cur);await c.user.updatePassword(nw);await a.signOut()},
  signUp:async(e,p)=>(await auth.createUserWithEmailAndPassword(e,p)).user.uid,signOut:()=>auth.signOut(),changePw:p=>auth.currentUser.updatePassword(p),
  async createUser(e,p){if(!sec)sec=firebase.initializeApp(FB_CFG,"sec");const a=sec.auth();const r=await a.createUserWithEmailAndPassword(e,p);await a.signOut();return r.user.uid},
  get:async p=>{const s=await fs.doc(p).get();return s.exists?dd(s):null},set:(p,d)=>fs.doc(p).set(d),update:(p,d)=>fs.doc(p).update(d),del:p=>fs.doc(p).delete(),
  list:async(p,w)=>(await q(p,w).get()).docs.map(dd),
  onDoc:(p,cb,er)=>fs.doc(p).onSnapshot(s=>cb(s.exists?dd(s):null),er),onList:(p,w,cb,er)=>q(p,w).onSnapshot(s=>cb(s.docs.map(dd)),er)}}

/* ===== Đăng nhập ===== */
function viewLogin(){$("app").innerHTML=`<div class="wrap narrow"><div style="text-align:center">${LOGO_IMG.replace('<img','<img style="width:92px;height:92px;border-radius:50%"')}<h1>Lớp Toán tư duy cô Oanh</h1><p class="sub">Đăng nhập để vào lớp học</p></div>
 <div class="panel"><label class="l">Tên đăng nhập (hoặc email của cô)</label><input id="lu" autocomplete="username" autocapitalize="none">
 <label class="l">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password">
 <div class="row" style="margin-top:14px"><button data-act="login" id="lgo">Đăng nhập</button><span class="note" id="lmsg"></span></div></div>
 <p class="note" style="text-align:center">Cô giáo mới? <a class="lk" data-act="tsign">Tạo tài khoản giáo viên</a></p></div>`;
 const go=e=>{if(e.key==="Enter")ACT.login()};$("lu").onkeydown=go;$("lp").onkeydown=go}
ACT.login=async()=>{const u=$("lu").value,p=$("lp").value;if(!u.trim()||!p){$("lmsg").textContent="Nhập đủ tên đăng nhập và mật khẩu.";return}
 $("lgo").disabled=true;$("lmsg").textContent="Đang đăng nhập…";try{await DB.signIn(toEmail(u),p)}catch(e){$("lmsg").textContent=authErr(e);$("lgo").disabled=false}};
ACT.tsign=()=>{$("app").innerHTML=`<div class="wrap narrow"><h1>Tạo tài khoản giáo viên</h1><p class="sub">Dùng email để đăng nhập sau này.</p><div class="panel">
 <label class="l">Họ tên</label><input id="sn" autocomplete="name"><label class="l">Email</label><input id="se" type="email" autocomplete="email">
 <label class="l">Mật khẩu (ít nhất 6 ký tự)</label><input id="sp" type="password" autocomplete="new-password">
 <div class="row" style="margin-top:14px"><button data-act="tsign2" id="sgo">Tạo tài khoản</button><button class="sec" data-act="tback">Quay lại</button><span class="note" id="smsg"></span></div></div></div>`};
ACT.tback=viewLogin;
ACT.tsign2=async()=>{const n=$("sn").value.trim(),e=$("se").value.trim().toLowerCase(),p=$("sp").value;if(!n||!e.includes("@")||p.length<6){$("smsg").textContent="Nhập đủ họ tên, email, mật khẩu (≥ 6 ký tự).";return}
 $("sgo").disabled=true;SIGNUP_BUSY=true;try{const uid=await DB.signUp(e,p);UID=uid;ME={id:uid,role:"teacher",name:n,teacherId:uid,classIds:[],createdAt:Date.now()};await DB.set("users/"+uid,ME);SIGNUP_BUSY=false;boot({uid})}
 catch(er){SIGNUP_BUSY=false;$("smsg").textContent=authErr(er);$("sgo").disabled=false}};
ACT.logout=async()=>{stopPlayer(true);await DB.signOut()};
const GL=new URLSearchParams(location.search).get("live");let GLDONE=false;

 if(it){const ans=rs.filter(r=>r.slides&&r.slides[i]&&(r.slides[i].ok||r.slides[i].gave)),ok=rs.filter(r=>r.slides&&r.slides[i]&&r.slides[i].ok),tried=rs.filter(r=>r.slides&&r.slides[i]&&r.slides[i].tries>0&&!r.slides[i].ok&&!r.slides[i].gave);
  h+=` · Làm đúng: <b>${ok.length}</b> · Đang thử: <b>${tried.length}</b>`;
  const wait=H.studs.filter(s=>!ans.find(r=>r.uid===s.id)).map(s=>s.name);if(wait.length&&wait.length<=14)h+=` · <span style="color:#cbd5e1">Chưa xong: ${wait.map(esc).join(", ")}</span>`}
 e.innerHTML=h}

const mailCfg=()=>{const c=ME&&ME.emailjs;return c&&c.s&&c.t&&c.k?c:null};
async function sendMail(cfg,p){const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:cfg.s,template_id:cfg.t,user_id:cfg.k,template_params:{to_email:p.to,subject:p.subject,message:p.message,student_name:p.name||"",from_name:"Lớp Toán tư duy cô Oanh"}})});if(!r.ok)throw new Error((await r.text()).slice(0,160)||"Không gửi được email")}
const appUrl=()=>location.href.split("?")[0].split("#")[0];
async function classStudents(cid){const us=await DB.list("users",[["teacherId","==",UID]]);return us.filter(u=>u.role==="student"&&(u.classIds||[]).includes(cid)).sort((a,b)=>a.name.localeCompare(b.name,"vi"))}
async function notify(list,a,kind,text){let n=0;for(const s of list){try{await DB.set("notices/"+nid(),{to:s.id,teacherId:UID,aid:a.id,title:a.title,text,kind,createdAt:Date.now(),read:false});n++}catch(e){}}return n}
let NOTU=null,NOTS=[],NOTINIT=false;
function watchNotices(){if(NOTU){NOTU();NOTU=null}NOTINIT=false;NOTU=DB.onList("notices",[["to","==",UID]],l=>{const fresh=NOTINIT?l.filter(x=>!x.read&&!NOTS.find(y=>y.id===x.id)):[];NOTS=l;NOTINIT=true;if(fresh.length)toast("🔔 "+fresh[0].text);renderNotices()},()=>{})}
function renderNotices(){const e=$("nt");if(!e)return;const un=NOTS.filter(x=>!x.read).sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
 e.innerHTML=un.length?`<div class="panel" style="border-color:var(--warn,#f59e0b)"><b>🔔 Thông báo (${un.length})</b>${un.map(x=>`<div class="row" style="margin:8px 0;flex-wrap:nowrap"><span class="grow">${esc(x.text)} <span class="note">· ${fmtD(x.createdAt)}</span></span>${x.aid?`<button class="sm" data-act="ntgo" data-n="${x.id}" data-a="${x.aid}">Làm bài ngay</button>`:""}<button class="sec sm" data-act="ntread" data-n="${x.id}">Đã xem</button></div>`).join("")}</div>`:""}
ACT.ntread=async d=>{const x=NOTS.find(y=>y.id===d.n);if(x)x.read=true;renderNotices();try{await DB.update("notices/"+d.n,{read:true})}catch(e){}};
ACT.ntgo=async d=>{ACT.ntread({n:d.n});ACT.play({id:d.a})};
ACT.remind=async d=>{try{const a=await DB.get("assignments/"+d.a);const [st,rs]=await Promise.all([classStudents(a.classId),DB.list(`assignments/${a.id}/results`)]);const done=new Set(rs.filter(r=>r.completedAt).map(r=>r.id));
  const list=d.u?st.filter(s=>s.id===d.u):st.filter(s=>!done.has(s.id));if(!list.length){toast("Cả lớp đã hoàn thành rồi 🎉");return}
  if(!d.u&&!confirm("Gửi nhắc làm bài “"+a.title+"” cho "+list.length+" em chưa hoàn thành?"))return;
  const n=await notify(list,a,"remind","Cô nhắc em làm bài “"+a.title+"”"+(a.due?" (hạn "+fmtDay(a.due)+")":"")+".");toast("Đã gửi nhắc cho "+n+" em. Các em thấy thông báo khi mở app.")}catch(e){alert(authErr(e))}};

async function tabLop(){const v=$("tv");v.innerHTML='<p class="note">Đang tải…</p>';

ACT.testmail=async()=>{const c={s:$("es").value.trim(),t:$("et").value.trim(),k:$("ek").value.trim()};if(!(c.s&&c.t&&c.k)){alert("Cô điền đủ 3 ô trước nhé.");return}const to=prompt("Gửi thử tới email nào?","");if(!to)return;try{await sendMail(c,{to,name:"Học sinh thử",subject:"[Lớp Toán tư duy cô Oanh] Email thử",message:"Đây là email thử từ app lớp học. Nếu cô thấy thư này là cài đặt đã đúng."});toast("Đã gửi. Cô kiểm tra hộp thư (cả mục Spam) nhé.")}catch(e){alert("Chưa gửi được: "+(e.message||e))}}

 const st=us.filter(u=>u.role==="student"&&(u.classIds||[]).includes(cid)).sort((a,b)=>a.name.localeCompare(b.name,"vi"));

 $("eok").onclick=async()=>{const n=$("en").value.trim(),m=$("ee").value.trim().toLowerCase();if(!n)return;if(m&&!m.includes("@")){alert("Email chưa đúng.");return}try{await DB.update("users/"+d.u,{name:n,parentEmail:m});o.remove();toast("Đã lưu.");classView(d.c)}catch(e){alert(authErr(e))}}};
ACT.resetpw=async d=>{const s=await DB.get("users/"+d.u);const nw=prompt("Mật khẩu mới cho “"+s.name+"” (ít nhất 6 ký tự):",genPw());if(!nw)return;if(nw.length<6){alert("Mật khẩu cần ít nhất 6 ký tự.");return}
 let cur=s.pw||"";for(let k=0;k<2;k++){if(!cur){cur=prompt("Cô chưa lưu mật khẩu hiện tại của em này. Nếu cô còn nhớ mật khẩu em đang dùng, nhập vào đây:")||"";if(!cur)return}

  catch(e){if(String(e.code||"").includes("invalid-credential")||String(e.code||"").includes("wrong-password")||String(e.code||"").includes("invalid-login")){cur="";if(k===0)alert("Mật khẩu đang lưu không còn đúng (có thể em đã tự đổi). Cô nhập mật khẩu em đang dùng nhé.");else alert("Vẫn chưa đúng. Cô hỏi lại em hoặc tạo lại tài khoản cho em với tên đăng nhập mới.")}else{alert(authErr(e));return}}}};

function genPw(){return String(Math.floor(100000+Math.random()*900000))}
ACT.addst=async d=>{const cid=d.id,lines=$("bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return;$("addb").disabled=true;const out=[];let i=0;
 for(const ln of lines){i++;$("addm").textContent=`Đang tạo ${i}/${lines.length}…`;const p=ln.split(/[;\t]/).map(s=>s.trim());const name=p[0];let user=slug(p[2]!==undefined&&p[1]?p[1]:p[1]||"")||"";let pw=p[2]||genPw();if(!/^[a-z0-9._-]{3,30}$/.test(user||"x")||!user)user=(slug(name).slice(-12)||"hs")+Math.floor(10+Math.random()*90);
  if(pw.length<6)pw=genPw();let ok=false,err="";for(let k=0;k<3&&!ok;k++){try{const uid=await DB.createUser(toEmail(user),pw);await DB.set("users/"+uid,{role:"student",name,username:user,pw,parentEmail:(p[3]||"").toLowerCase(),teacherId:UID,classIds:[cid],createdAt:Date.now()});ok=true}catch(e){if(String(e.code||"").includes("email-already-in-use")){user=user.replace(/\d+$/,"")+Math.floor(100+Math.random()*900)}else{err=authErr(e);break}}}

 if(d&&(d.kick||[]).includes(UID)){toast("Cô đã mời em ra khỏi buổi học.");alert("Cô đã mời em ra khỏi buổi học trực tiếp.");stopPlayer(false);return}
 if(!d||!d.on){const was=P.wait;P.wait=true;P.over=!!(d&&d.ended);if(P.over&&!was){toast("Cô đã kết thúc buổi học.");stopPlayer(false);return}draw();return}
 const was=P.wait;P.wait=false;P.over=false;const c=Math.min(d.cur||0,P.n-1),s=P.sl[c],st=(s.ok||s.gave)?clicks(c):(d.st||0);
 const cd=(d.draw||[]).includes(UID),callNew=d.call||null,callChanged=JSON.stringify(callNew)!==JSON.stringify(P.call);
 const permChanged=cd!==P.canDraw;P.canDraw=cd;P.call=callNew;if(permChanged){INKS.tool=cd?"pen":"none";toast(cd?"✍ Cô cho em viết lên slide!":"Cô đã thu lại quyền viết.")}
 if(callChanged&&callNew&&callNew.uid===UID)toast("🙋 Cô gọi em lên bảng!");
 if(was||c!==P.cur||st!==P.st||permChanged){P.cur=c;P.st=st;P.msg="";P.msgc="";P.dirty=true;draw();savePlayer(true)}else if(callChanged)updHead()}
ACT.play=async d=>{toast("Đang mở bài…");try{const a=await DB.get("assignments/"+d.id);const L=await loadLesson(a.lessonId);const prev=await DB.get(`assignments/${a.id}/results/${UID}`);startPlayer(a,L,prev)}catch(e){alert("Không mở được bài: "+authErr(e))}};
function startPlayer(a,L,prev,live){INK.docs={};INKS.tool="none";INKS.sel=new Set();INKS.undo=[];LESSON=L;STY=(L.form&&L.form.sty)||"sang";const n=L.slides.length;
 const sl=[];for(let i=0;i<n;i++){const it=interactiveOf(i),o=prev&&prev.slides&&prev.slides[i]||{};sl.push({it,ms:o.ms||0,seen:!!o.seen,tries:o.tries||0,ok:!!o.ok,gave:!!o.gave,pts:o.pts||0,wrong:[]})}
 P={mailSent:!!(prev&&prev.mailSent),a,n,sl,cur:Math.min(prev&&prev.last||0,n-1),st:0,startedAt:(prev&&prev.startedAt)||Date.now(),completedAt:(prev&&prev.completedAt)||null,totalMs:(prev&&prev.totalMs)||0,dirty:true,lastSave:0,msg:"",tick:null,live:!!live,wait:!!live,over:false,unsub:null,canDraw:false,call:null,unInk:null,hb:0};
 if(P.sl[P.cur].ok||P.sl[P.cur].gave)P.st=clicks(P.cur);
 const o=document.createElement("div");o.id="pl";document.body.appendChild(o);document.body.style.overflow="hidden";
 if(live){P.unsub=DB.onDoc("live/"+a.id,onLive,e=>toast("Không nối được phòng học: "+authErr(e)));P.unInk=DB.onList(`live/${a.id}/ink`,null,inkIngest,()=>{});const hb=()=>DB.set(`live/${a.id}/who/${UID}`,{name:ME.name,t:Date.now()}).catch(()=>{});hb();P.hb=setInterval(hb,20000)}P.tick=setInterval(playerTick,1000);document.addEventListener("visibilitychange",onVis);addEventListener("beforeunload",onUnload);addEventListener("keydown",onKey);draw();savePlayer()}
function onVis(){if(document.visibilityState==="hidden")savePlayer(true)}function onUnload(){savePlayer(true)}
function onKey(e){if(!P||P.live||["INPUT","TEXTAREA"].includes(e.target.tagName))return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();nextStep()}else if(e.key==="ArrowLeft")prevSlide()}
function playerTick(){if(!P||P.wait)return;if(document.visibilityState!=="visible")return;const s=P.sl[P.cur];s.ms+=1000;P.totalMs+=1000;if(!s.seen&&s.ms>=SEEN_MS){s.seen=true;P.dirty=true;toast("✓ Đã học xong slide này");updHead()}updDw();
 if(P.dirty&&Date.now()-P.lastSave>30000)savePlayer()}
function stats(){const n=P.n;let seen=0,qT=0,qOk=0,sc=0,qDone=0;P.sl.forEach(s=>{if(s.seen)seen++;if(s.it){qT++;if(s.ok)qOk++;if(s.ok||s.gave)qDone++;sc+=s.pts}});
 return{pct:Math.round(seen/n*100),qTotal:qT,qOk,qDone,score:sc,maxScore:qT*100}}
async function savePlayer(quiet){if(!P)return;const S=stats();let newly=false;if(!P.completedAt&&S.pct>=100&&S.qDone>=S.qTotal){P.completedAt=Date.now();newly=true;if(!quiet)toast("🎉 Em đã hoàn thành bài!")}
 const sl={};P.sl.forEach((s,i)=>{sl[i]={ms:s.ms,seen:s.seen,q:!!s.it,tries:s.tries,ok:s.ok,gave:s.gave,pts:s.pts}});
 const doc={uid:UID,name:ME.name,aid:P.a.id,classId:P.a.classId,mailSent:!!P.mailSent,startedAt:P.startedAt,lastAt:Date.now(),completedAt:P.completedAt||null,totalMs:P.totalMs,last:P.cur,slideCount:P.n,...S,slides:sl};
 P.dirty=false;P.lastSave=Date.now();try{await DB.set(`assignments/${P.a.id}/results/${UID}`,doc);
  if(newly&&!P.mailSent&&P.a.mail&&ME.parentEmail&&ME.role==="student"){P.mailSent=true;const a=P.a,pe=ME.parentEmail,nm=ME.name,aid=a.id;
   sendMail(a.mail,{to:pe,name:nm,subject:"[Lớp Toán tư duy cô Oanh] "+nm+" đã hoàn thành bài “"+a.title+"”",message:"Kính gửi phụ huynh,\n\nEm "+nm+" vừa hoàn thành bài “"+a.title+"” (lớp "+a.className+").\n\n• Đã học: "+S.pct+"% số slide\n• Câu đúng: "+S.qOk+"/"+S.qTotal+"\n• Điểm: "+S.score+"/"+S.maxScore+"\n• Thời gian học: "+fmtT(P&&P.totalMs||doc.totalMs)+"\n• Hoàn thành lúc: "+fmtD(doc.completedAt)+"\n\nTrân trọng,\nCô Oanh – Lớp Toán tư duy"}).then(()=>DB.update(`assignments/${aid}/results/${UID}`,{mailSent:true})).catch(()=>{if(P)P.mailSent=false})}
 }catch(e){P.dirty=true;if(!quiet)toast("Chưa lưu được kết quả: "+authErr(e))}}
function stopPlayer(noSave){if(!P)return;clearInterval(P.tick);if(P.unsub)P.unsub();if(P.unInk)P.unInk();if(P.hb){clearInterval(P.hb);DB.set(`live/${P.a.id}/who/${UID}`,{name:ME.name,t:0}).catch(()=>{})}INKS.tool="none";document.removeEventListener("visibilitychange",onVis);removeEventListener("beforeunload",onUnload);removeEventListener("keydown",onKey);const p=P;P=null;const o=$("pl");if(o)o.remove();document.body.style.overflow="";
 if(!noSave){P=p;savePlayer(true).finally(()=>{P=null;if(ME&&ME.role==="student")studentHome();else if(ME&&ME.role==="guest")guestHome()})}else if(ME&&ME.role==="guest")guestHome()}
ACT.pexit=()=>stopPlayer(false);
function updHead(){if(!P)return;const S=stats(),e=$("phd");if(e)e.innerHTML=`<button data-act="pexit">← Thoát</button><b style="flex:none">${esc(P.a.title)}</b><div class="bar pb"><i style="width:${S.pct}%"></i></div><span class="dw">${S.pct}% đã học</span><span class="dw">Điểm ${S.score}/${S.maxScore}</span>${P.live&&P.call?`<span class="chip wa">🙋 ${esc(P.call.uid===UID?"Cô gọi em lên bảng!":P.call.name+" đang lên bảng")}</span>`:""}`}
function updDw(){const e=$("pdw");if(!e||!P)return;const s=P.sl[P.cur];e.textContent=s.seen?"✓ Đã học":"⏱ Còn "+Math.max(0,Math.ceil((SEEN_MS-s.ms)/1000))+"s để tính là đã học"}
function draw(){const o=$("pl");if(!o||!P)return;const s=P.sl[P.cur],it=s.it,solved=s.ok||s.gave;const last=P.cur===P.n-1;
 let ctl="";if(it&&!solved){if(it.kind==="mc")ctl=`<div class="opts" style="--n:${it.opts.length}">${it.opts.map((x,i)=>`<button class="o${i}${s.wrong.includes(i)?" x":""}" data-act="pick" data-i="${i}" ${s.wrong.includes(i)?"disabled":""}>${String.fromCharCode(65+i)}</button>`).join("")}</div>`;
  else ctl=`<div class="row" style="flex-wrap:nowrap"><input id="pans" placeholder="Nhập đáp án của em…" autocomplete="off" style="font-size:20px"><button data-act="psend">Gửi</button></div>`;
  if(s.tries>=2)ctl+=`<div style="text-align:center"><button class="sec sm" data-act="pgive" style="color:#fff;border-color:#fff8">Xem lời giải (không tính điểm)</button></div>`}
 if(P.live&&P.wait){o.innerHTML=`<div class="hd" id="phd"></div><div class="stage"><div style="text-align:center;padding:24px"><div style="font-size:54px">${P.over?"👋":"⏳"}</div><h2 style="color:#fff">${P.over?"Buổi học đã kết thúc":"Đang chờ cô bắt đầu…"}</h2><p class="note" style="color:#cbd5e1">${P.over?"Em bấm Thoát để về trang chính.":"Cô chiếu là slide tự hiện ra, em cứ để màn hình này nhé."}</p></div></div>`;updHead();return}
 o.innerHTML=`<div class="hd" id="phd"></div><div class="stage"><div class="slw"><div class="sld" id="psl">${slideHtml(P.cur,P.st)}</div><svg id="ink" viewBox="0 0 1600 900" preserveAspectRatio="none"></svg></div></div><div class="ft">${P.live&&P.canDraw?'<div class="tb" id="stb"></div>':""}${ctl}<div class="msgl ${P.msgc||""}" id="pmsg">${esc(P.msg||"")}</div>
 ${P.live?`<div class="nav"><span class="dw" id="pdw"></span><span class="dw">Slide ${P.cur+1}/${P.n} · cô đang chiếu</span></div>`:`<div class="nav"><button data-act="pprev" ${P.cur===0?"disabled":""}>◀ Trước</button><span class="dw" id="pdw"></span><span class="dw">Slide ${P.cur+1}/${P.n}</span><button class="go" data-act="pnext">${last&&P.st>=clicks(P.cur)?"Hoàn thành ✓":"Tiếp ▶"}</button></div>`}</div>`;
 updHead();updDw();inkTb();inkRender();const inp=$("pans");if(inp){inp.onkeydown=e=>{if(e.key==="Enter")ACT.psend()};inp.focus()}}
function say(m,c){P.msg=m;P.msgc=c||"";const e=$("pmsg");if(e){e.textContent=m;e.className="msgl "+(c||"")}}
function answer(v){const s=P.sl[P.cur],it=s.it;if(!it||s.ok||s.gave)return;s.tries++;P.dirty=true;
 if(it.kind==="mc"&&it.correct==null){s.ok=true;s.pts=0;P.st=clicks(P.cur);P.msg="Đã ghi nhận đáp án của em.";P.msgc="";draw();savePlayer(true);return}
 if(judgeAns(it,v)){s.ok=true;s.pts=ptsOf(s.tries,false);P.st=clicks(P.cur);P.msg="✓ Đúng rồi! +"+s.pts+" điểm";P.msgc="ok";draw();savePlayer(true)}
 else{if(it.kind==="mc")s.wrong.push(v);P.msg="✗ Chưa đúng, em thử lại nhé ("+s.tries+" lần)";P.msgc="no";draw();savePlayer(true)}}
ACT.pick=d=>answer(+d.i);ACT.psend=()=>{const i=$("pans");if(i&&i.value.trim())answer(i.value.trim());else if(i)say("Em nhập đáp án trước nhé.","no")};

function nextStep(){if(!P)return;if(P.st<clicks(P.cur)){P.st++;P.msg="";draw()}else if(P.cur<P.n-1){gotoSlide(P.cur+1)}else{toast("Em đã đến slide cuối.");stopPlayer(false)}}
