<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8e6;color:#3b2a14;background-image:radial-gradient(#f3e3b8 1.5px,transparent 1.5px);background-size:22px 22px;display:flex;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:560px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.15}
.btn{min-height:48px;min-width:48px;border:0;border-radius:14px;background:#2f6fe0;color:#fff;font-size:17px;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #1d4ea8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ea8}
.btn.sec{background:#fff;color:#2f6fe0;border:2px solid #2f6fe0;box-shadow:0 4px 0 #b9cdf3}
.btn.ok{background:#27a95b;box-shadow:0 4px 0 #1b7d41}
.btn.warn{background:#f59e0b;box-shadow:0 4px 0 #b97500}
.btn[disabled]{opacity:.45}
.card{background:#fff;border:3px solid #f1d58a;border-radius:20px;padding:12px}
.how{font-size:15px;line-height:1.45}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#fff;border:2px solid #f1d58a;border-radius:14px;text-align:center;padding:6px 4px}
.stat small{display:block;font-size:12px;color:#8a6a2a;font-weight:700;text-transform:uppercase}
.stat b{font-size:22px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv button{min-height:72px;border-radius:16px;border:3px solid #f1d58a;background:#fff;font-size:22px;font-weight:800;color:#3b2a14;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv button small{font-size:15px;letter-spacing:1px;color:#f59e0b;min-height:18px}
.lv button.done{background:#eafbe9;border-color:#7ed28a}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(40,25,5,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov .box{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:100%;text-align:center;border:4px solid #f1d58a}
.ov h2{margin:0 0 6px;font-size:26px}
.stars{font-size:46px;letter-spacing:4px;color:#f59e0b}
input.tx{width:100%;min-height:48px;border:3px solid #f1d58a;border-radius:14px;font-size:18px;padding:0 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2a14;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:92%;text-align:center}
.hide{display:none!important}
.note{font-size:13px;color:#8a6a2a}


#bd{width:100%;max-width:460px;margin:0 auto;background:#fff;border:3px solid #f1d58a;border-radius:12px;touch-action:manipulation;user-select:none}
#bd svg{width:100%;display:block}
.pal{display:flex;gap:10px;justify-content:center}
.pal button{width:64px;height:64px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #d9c58a;cursor:pointer}
.pal button.on{box-shadow:0 0 0 5px #3b2a14}

function play(i){cur=i;L=LV[i];R=L.r;C=L.c;const n=L.sol.length;col=Array(n).fill(-1);Object.entries(L.given).forEach(([k,v])=>col[+k]=v);adj=Array.from({length:n},()=>new Set());
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){[[0,1],[1,0]].forEach(([a,b])=>{const r2=r+a,c2=c+b;if(r2<R&&c2<C&&L.g[r][c]!==L.g[r2][c2]){adj[L.g[r][c]].add(L.g[r2][c2]);adj[L.g[r2][c2]].add(L.g[r][c])}})}
 pick=0;t0=Date.now();done=false;moves=0;
 app.innerHTML=`<div class="top"><button class="btn sec" id="bk">←</button><h1>Màn ${i+1} <small class="note">(${n} miền)</small></h1><button class="btn sec" id="mu"></button></div>
<div class="stats"><div class="stat"><small>Thời gian</small><b id="tt">0:00</b></div><div class="stat"><small>Đã tô</small><b id="dn">0</b></div></div>
<div id="bd"></div><div class="pal" id="pl">${CL.map((c,k)=>`<button data-k="${k}" style="background:${c}" aria-label="${NM[k]}"></button>`).join('')}<button data-k="-1" style="background:#fff;font-size:26px">⌫</button></div>
<div class="row"><button class="btn warn" id="hn">💡 Gợi ý</button><button class="btn sec" id="rs">↺ Làm lại</button></div>`;
 G.muteBtn(G.$('mu'));G.$('bk').onclick=home;G.$('rs').onclick=()=>play(cur);G.$('hn').onclick=hint;
 G.$('pl').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k==null)return;pick=+k;G.snd.tap();pal()};
 const tm=setInterval(()=>{if(!G.$('tt')||done){clearInterval(tm);return}G.$('tt').textContent=G.fmt((Date.now()-t0)/1000)},500);
 G.$('bd').onclick=e=>{if(done)return;const s=G.$('bd').querySelector('svg').getBoundingClientRect();const c=Math.floor((e.clientX-s.left)/s.width*C),r=Math.floor((e.clientY-s.top)/s.height*R);if(r<0||c<0||r>=R||c>=C)return;paint(L.g[r][c])};
 pal();draw()}
function pal(){[...G.$('pl').children].forEach(b=>b.classList.toggle('on',+b.dataset.k===pick))}
function paint(id){if(L.given[id]!==undefined){G.toast('Miền này đã có màu sẵn, không đổi được nhé');return}col[id]=pick;moves++;if(pick>=0){bad().has(id)?G.snd.bad():G.snd.tap()}draw();check()}
function bad(){const b=new Set();col.forEach((c,i)=>{if(c<0)return;adj[i].forEach(j=>{if(col[j]===c){b.add(i);b.add(j)}})});return b}
function draw(){const S=60,W=C*S,H=R*S;let s=`<svg viewBox="0 0 ${W} ${H}">`;const B=bad();
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const id=L.g[r][c];s+=`<rect x="${c*S}" y="${r*S}" width="${S}" height="${S}" fill="${col[id]>=0?CL[col[id]]:'#fff'}"/>`}
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const id=L.g[r][c];
  if(c+1<C&&L.g[r][c+1]!==id)s+=`<line x1="${(c+1)*S}" y1="${r*S}" x2="${(c+1)*S}" y2="${(r+1)*S}" stroke="#0d2a6b" stroke-width="3"/>`;
  if(r+1<R&&L.g[r+1][c]!==id)s+=`<line x1="${c*S}" y1="${(r+1)*S}" x2="${(c+1)*S}" y2="${(r+1)*S}" stroke="#0d2a6b" stroke-width="3"/>`}
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const id=L.g[r][c];if(B.has(id)){const e=[[c===0||L.g[r][c-1]!==id,c*S,r*S,c*S,(r+1)*S],[c===C-1||L.g[r][c+1]!==id,(c+1)*S,r*S,(c+1)*S,(r+1)*S],[r===0||L.g[r-1][c]!==id,c*S,r*S,(c+1)*S,r*S],[r===R-1||L.g[r+1][c]!==id,c*S,(r+1)*S,(c+1)*S,(r+1)*S]];e.forEach(x=>{if(x[0])s+=`<line x1="${x[1]}" y1="${x[2]}" x2="${x[3]}" y2="${x[4]}" stroke="#ff1744" stroke-width="6" stroke-dasharray="6 5"/>`})}}
 s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#0d2a6b" stroke-width="4"/></svg>`;G.$('bd').innerHTML=s;G.$('dn').textContent=col.filter(x=>x>=0).length+'/'+col.length}
function hint(){if(done)return;for(let i=0;i<col.length;i++){if(col[i]<0||bad().has(i)){if(L.given[i]!==undefined)continue;col[i]=L.sol[i];moves+=3;G.snd.ok();draw();check();return}}}
function check(){if(col.some(c=>c<0)||bad().size)return;done=true;const sec=(Date.now()-t0)/1000,n=col.length,free=n-Object.keys(L.given).length,st=moves<=free+2?3:moves<=free*2?2:1;G.snd.win();G.saveStars(KEY,cur,st);G.report(GAME,{level:cur+1,score:st*10,correct:st,total:3,timeSec:Math.round(sec)});
 const nx=cur+1<LV.length;const o=G.overlay(`<h2>🎉 Tô xong rồi!</h2><div class="stars">${G.stars(st)}</div><p>Thời gian ${G.fmt(sec)}.</p><div class="row"><button class="btn ok" id="o1">${nx?'Màn tiếp ➜':'Về chọn màn'}</button><button class="btn sec" id="o3">Chọn màn</button></div>`);
 G.$('o1').onclick=()=>{o.remove();nx?play(cur+1):home()};G.$('o3').onclick=()=>{o.remove();home()}}
home();
</script></body></html>
