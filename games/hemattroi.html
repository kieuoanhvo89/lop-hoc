<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hệ Mặt Trời</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#050816;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#wrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0b1230;border-bottom:1px solid #223;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.tab,.btn,.chip{border:0;border-radius:12px;background:#1b2750;color:#e8eefc;font-size:15px;font-weight:700;padding:0 12px;min-height:40px;cursor:pointer;font-family:inherit}
.tab.on,.btn.on{background:#3b6cf0;color:#fff}
.btn:active,.tab:active{filter:brightness(1.25)}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:180px;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
#hud{position:absolute;left:10px;top:8px;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;line-height:1.35}
#hud small{display:block;font-weight:500;opacity:.75;font-size:12px}
#ctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 10px;background:#0b1230;border-top:1px solid #223}
#ctl input[type=range]{width:130px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#0b1230;border-top:1px solid #223;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:36px;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:#3b6cf0}
#card{display:none;background:#0e1738;border-top:2px solid #3b6cf0;padding:10px 12px;overflow:auto;max-height:42vh;font-size:15px;line-height:1.45}
#card h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px}
#card h2 .x{margin-left:auto;font-size:18px;background:#1b2750;border:0;color:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer}
#card .sub{opacity:.8;margin-bottom:6px}
#card table{width:100%;border-collapse:collapse}
#card td{padding:3px 0;vertical-align:top;border-bottom:1px solid #1f2b57}
#card td:first-child{opacity:.75;width:46%;padding-right:8px}
#card .fact{background:#16224d;border-radius:10px;padding:8px 10px;margin:8px 0}
#card .wt{background:#10321f;border-radius:10px;padding:8px 10px;margin:8px 0}
#card .wt input{width:70px;font-size:16px;border-radius:8px;border:0;padding:4px 6px;text-align:center}
#card .mini{opacity:.85;font-size:13.5px;margin-top:6px}
.foot{font-size:12px;opacity:.6;padding:4px 12px 8px}
@media(min-width:900px){
 #body{flex-direction:row}
 #card{max-height:none;width:360px;border-top:0;border-left:2px solid #3b6cf0}
 #side{display:flex;flex-direction:column;min-width:0;flex:1}
}
@media(max-width:899px){#side{display:flex;flex-direction:column;flex:1;min-height:0}#card{max-height:36vh}}
@media(max-width:600px){header{flex-wrap:nowrap;padding:5px 8px;gap:6px}header h1{font-size:16px}.tab,.btn{min-height:36px;padding:0 10px;font-size:14px}#fs{display:none}
 #ctl{flex-wrap:nowrap;overflow-x:auto;padding:5px 8px;gap:6px;scrollbar-width:none}#ctl .btn,#spdL{flex:none}#ctl input[type=range]{width:84px;flex:none}#spdL{min-width:88px!important;font-size:12px!important}
 #chips{padding:5px 8px}.chip{min-height:32px;font-size:13px}#card{padding:8px 10px;font-size:14px}#card h2{font-size:18px}#stage{min-height:200px}}
</style></head>
<body><div id="wrap">
<header><h1>🪐 Hệ Mặt Trời</h1>
<button class="tab on" id="vOrb">Quỹ đạo</button><button class="tab" id="vSize">Kích thước</button><button class="btn" id="fs" title="Toàn màn hình">⛶</button></header>
<div id="body"><div id="side">
<div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
<div id="ctl">
 <button class="btn" id="play">⏸</button>

 <button class="btn" id="today">📅 Hôm nay</button>
 <button class="btn on" id="tName">Tên</button><button class="btn on" id="tOrb">Quỹ đạo</button>
 <button class="btn" id="zAll">🔭 Cả hệ</button><button class="btn" id="zIn">🌍 Gần Mặt Trời</button>
</div>
<div id="chips"></div>
</div><div id="card"></div></div>
</div>

];
const SUN={k:"sun",vn:"Mặt Trời",d:1392700,pal:["#fff6c0","#ffc531","#e8590c"]};
const BYK={};PL.forEach(p=>BYK[p.k]=p);BYK.sun=SUN;
/* ===== Quỹ đạo: nguyên tố gần đúng (JPL, Standish), có kiểm tra với các ngày xung đối ===== */
const EL={mercury:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593,149472.67411175],venus:[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255,58517.81538729],earth:[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0,35999.37244981],mars:[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891,19140.30268499],jupiter:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909,3034.74612775],saturn:[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448,1222.49362201],uranus:[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503,428.48202785],neptune:[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574,218.45945325],pluto:[39.48211675,0.24882730,17.14001206,238.92903833,224.06891629,110.30393684,145.20780515]};
const D2R=Math.PI/180,J2000=946728000000,K=66,AU_KM=149.5979;
const cmp=r=>K*Math.sqrt(r)/r;
function planePos(el,nu,r){const om=(el[4]-el[5])*D2R,O=el[5]*D2R,i=el[2]*D2R,u=om+nu;
 return[r*(Math.cos(O)*Math.cos(u)-Math.sin(O)*Math.sin(u)*Math.cos(i)),r*(Math.sin(O)*Math.cos(u)+Math.cos(O)*Math.sin(u)*Math.cos(i)),r*Math.sin(u)*Math.sin(i)]}
function posAU(k,ms){const el=EL[k],T=(ms-J2000)/86400000/36525,L=el[3]+el[6]*T,M=(((L-el[4])%360)+540)%360-180,e=el[1];
 let E=M*D2R+e*Math.sin(M*D2R);for(let i=0;i<25;i++)E-=(E-e*Math.sin(E)-M*D2R)/(1-e*Math.cos(E));
 const xo=el[0]*(Math.cos(E)-e),yo=el[0]*Math.sqrt(1-e*e)*Math.sin(E),nu=Math.atan2(yo,xo),r=Math.hypot(xo,yo);const p=planePos(el,nu,r);return{x:p[0],y:p[1],z:p[2],r}}
function scenePos(k,ms){const p=posAU(k,ms),s=cmp(p.r);return{x:p.x*s,y:p.y*s,z:p.z*s,r:p.r}}
const ORB={};PL.forEach(p=>{const el=EL[p.k],pts=[];for(let j=0;j<=160;j++){const nu=j/160*2*Math.PI,r=el[0]*(1-el[1]*el[1])/(1+el[1]*Math.cos(nu)),q=planePos(el,nu,r),s=cmp(r);pts.push([q[0]*s,q[1]*s,q[2]*s])}ORB[p.k]=pts});
/* vành đai tiểu hành tinh (minh họa): 450 điểm giữa Sao Hỏa và Sao Mộc */
const BELT=(()=>{let s=7;const R=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};const a=[];for(let i=0;i<450;i++){const aa=2.15+R()*1.2,e=R()*.12;a.push({a:aa,e,ph:R()*6.283,z:(R()-.5)*.35,w:R()*6.283})}return a})();

const cv=document.getElementById("cv"),cx=cv.getContext("2d");let W=0,H=0,DPR=1,stars=null;
const SPD=[[1,"1 ngày/giây"],[10,"10 ngày/giây"],[30,"1 tháng/giây"],[91,"3 tháng/giây"],[365.25,"1 năm/giây"],[1826,"5 năm/giây"],[7305,"20 năm/giây"]];
const S={mode:"orb",yaw:-0.5,pitch:1.05,zoom:.4,tx:0,ty:0,tz:0,tzoom:.4,sel:null,ft:0,playing:true,spd:1,simMs:Date.now(),names:true,orbits:true,dirty:true,withSun:false,tgtOn:false};
const $=id=>document.getElementById(id);
const fmt=(n,d)=>n.toLocaleString("vi-VN",{maximumFractionDigits:d==null?0:d});
function fitZoom(rScene){return Math.max(.1,Math.min(W,H)*.5*.9/rScene)}
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 let s=11;const R=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};stars=[];const n=Math.round(W*H/2600);for(let i=0;i<n;i++)stars.push([R()*W,R()*H,R()*1.2+.3,R()*.6+.35]);
 if(!S.sel&&S.mode==="orb"&&!S.zoomSet){S.zoom=S.tzoom=fitZoom(400)}S.dirty=true}
function proj(x,y,z){const dx=x-S.tx,dy=y-S.ty,dz=z-S.tz,cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
 const xr=dx*cy-dy*sy,yr=dx*sy+dy*cy;return{x:W/2+xr*S.zoom,y:H/2-(yr*sp+dz*cp)*S.zoom,d:dz*sp-yr*cp}}
function rBase(b){return b===SUN?16:4.5*Math.pow(b.d/12756,.45)}
function selR(b){const n=Math.max(.3,Math.min(1,Math.pow(b.d/142984,.4)));return b===SUN?60:14+26*n}
function rScreen(b){const r0=Math.max(b===SUN?7:2.4,rBase(b)*Math.pow(S.zoom,.55));return S.sel===b.k?r0+(selR(b)-r0)*S.ft:r0}
function bodies(){const a=[{b:SUN,x:0,y:0,z:0,r:0}];PL.forEach(p=>{const q=scenePos(p.k,S.simMs);a.push({b:p,x:q.x,y:q.y,z:q.z,r:q.r})});return a}
/* ===== Vẽ ===== */

 g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=g;cx.fill();cx.clip();

  if(k==="jupiter"||k==="saturn"){const bands=k==="jupiter"?[-.78,-.55,-.34,-.12,.1,.3,.52,.74]:[-.7,-.45,-.2,.05,.3,.55];bands.forEach((t,i)=>{cx.fillStyle=i%2?"rgba(255,235,200,.14)":"rgba(90,50,20,.20)";cx.fillRect(x-r,y+t*r-r*.07,r*2,r*.14)});

  else if(k==="earth"){cx.fillStyle="rgba(70,170,90,.85)";[[-.3,-.1,.32,.22],[.28,.25,.22,.3],[.1,-.5,.2,.12],[-.45,.4,.14,.1]].forEach(c=>{cx.beginPath();cx.ellipse(x+c[0]*r,y+c[1]*r,c[2]*r,c[3]*r,.4,0,7);cx.fill()});cx.fillStyle="rgba(255,255,255,.55)";cx.beginPath();cx.ellipse(x,y-r*.88,r*.4,r*.14,0,0,7);cx.fill();cx.beginPath();cx.ellipse(x,y+r*.9,r*.4,r*.12,0,0,7);cx.fill()}

  else if(k==="venus"){cx.fillStyle="rgba(255,255,255,.18)";[-.5,-.15,.25,.6].forEach(t=>{cx.beginPath();cx.ellipse(x,y+t*r,r*.95,r*.08,0,0,7);cx.fill()})}}
 /* bóng đêm: phía xa Mặt Trời tối dần */
 const sh=cx.createRadialGradient(x+lx*r*.2,y+ly*r*.2,r*.55,x-lx*r*.9,y-ly*r*.9,r*1.9);sh.addColorStop(0,"rgba(0,0,10,0)");sh.addColorStop(1,"rgba(0,0,14,.75)");cx.fillStyle=sh;cx.fillRect(x-r,y-r,r*2,r*2);cx.restore()}
function ringPath(x,y,rx,ry,half){cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,Math.PI*2)}

 cx.beginPath();cx.ellipse(x,y,R2,Math.max(.5,R2*sp),0,0,7);cx.ellipse(x,y,R1,Math.max(.4,R1*sp),0,0,7);const g=cx.createRadialGradient(x,y,R1,x,y,R2);g.addColorStop(0,"rgba(190,160,110,.85)");g.addColorStop(.45,"rgba(240,220,170,.9)");g.addColorStop(.62,"rgba(60,50,30,.35)");g.addColorStop(.7,"rgba(235,215,165,.88)");g.addColorStop(1,"rgba(200,175,120,.6)");

let LBL=[];
function label(t,x,y,sel){cx.font=(sel?"700 15px ":"600 13px ")+"system-ui,Arial,sans-serif";const w=cx.measureText(t).width,r=[x-2,y-14,w+4,18];

function drawBG(){cx.fillStyle="#050816";cx.fillRect(0,0,W,H);const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,"#0c1236");g.addColorStop(1,"#030510");cx.fillStyle=g;cx.fillRect(0,0,W,H);
