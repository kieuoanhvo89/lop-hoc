<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Giải mã khóa</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8e6;color:#3b2a14;background-image:radial-gradient(#f3e3b8 1.5px,transparent 1.5px);background-size:22px 22px;display:flex;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:560px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.15}
.btn{min-height:48px;min-width:48px;border:0;border-radius:14px;background:#2f6fe0;color:#fff;font-size:17px;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #1d4ea8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ea8}
.btn.sec{background:#fff;color:#2f6fe0;border:2px solid #2f6fe0;box-shadow:0 4px 0 #b9cdf3}
.btn.ok{background:#27a95b;box-shadow:0 4px 0 #1b7d41}
.btn.warn{background:#f59e0b;box-shadow:0 4px 0 #b97500}
.btn[disabled]{opacity:.45}
.card{background:#fff;border:3px solid #f1d58a;border-radius:20px;padding:12px}
.how{font-size:15px;line-height:1.45}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#fff;border:2px solid #f1d58a;border-radius:14px;text-align:center;padding:6px 4px}
.stat small{display:block;font-size:12px;color:#8a6a2a;font-weight:700;text-transform:uppercase}
.stat b{font-size:22px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv button{min-height:72px;border-radius:16px;border:3px solid #f1d58a;background:#fff;font-size:22px;font-weight:800;color:#3b2a14;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv button small{font-size:15px;letter-spacing:1px;color:#f59e0b;min-height:18px}
.lv button.done{background:#eafbe9;border-color:#7ed28a}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(40,25,5,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov .box{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:100%;text-align:center;border:4px solid #f1d58a}
.ov h2{margin:0 0 6px;font-size:26px}
.stars{font-size:46px;letter-spacing:4px;color:#f59e0b}
input.tx{width:100%;min-height:48px;border:3px solid #f1d58a;border-radius:14px;font-size:18px;padding:0 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2a14;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:92%;text-align:center}
.hide{display:none!important}
.note{font-size:13px;color:#8a6a2a}


.clue{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #f1d58a;border-radius:16px;padding:8px 10px}
.tiles{display:flex;gap:6px}
.tile{width:46px;height:52px;border-radius:10px;background:#fffdf5;border:3px solid #cbb26b;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative}
.tile.x{background:#eee;color:#aaa;text-decoration:line-through;border-color:#ccc}
.tile.v{background:#e3f8e6;border-color:#27a95b;color:#1b7d41}
.ctext{font-size:15px;line-height:1.3;flex:1}
.slots{display:flex;gap:10px;justify-content:center;margin:4px 0}
.slot{width:56px;height:68px;border-radius:12px;border:4px solid #2f6fe0;background:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center}
.slot.on{box-shadow:0 0 0 4px #b9cdf3}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{min-height:54px;font-size:24px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style></head><body><div id="app"></div>
<script>const G=(()=>{
 const S={mute:false,ctx:null};
 const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
 const $=id=>document.getElementById(id);
 function tone(f,d,t,v){try{if(S.mute)return;S.ctx=S.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=S.ctx,o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.08;o.connect(g);g.connect(c.destination);const n=c.currentTime;g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
 const snd={ok(){tone(660,.12);setTimeout(()=>tone(880,.16),110)},bad(){tone(200,.25,'sawtooth',.06)},tap(){tone(500,.05,'triangle',.05)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*130))}};
 function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}
 function overlay(html){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(o);return o}
 function name(){return ls.get('g_name','')}
 function askName(cb){if(name()){cb&&cb();return}const o=overlay('<h2>Em tên là gì?</h2><p class="note">Để cô biết ai đang chơi nhé.</p><input class="tx" id="gnm" maxlength="30" placeholder="Nhập tên của em"><div class="row" style="margin-top:12px"><button class="btn ok" id="gok">Bắt đầu</button><button class="btn sec" id="gsk">Bỏ qua</button></div>');
  const done=()=>{const v=$('gnm').value.trim();if(v)ls.set('g_name',v);o.remove();cb&&cb()};$('gok').onclick=done;$('gsk').onclick=()=>{o.remove();cb&&cb()};$('gnm').onkeydown=e=>{if(e.key==='Enter')done()}}
 function report(game,r){try{parent.postMessage(Object.assign({type:'game-result',game:game,name:name()},r),'*')}catch(e){}}
 function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
 function levelGrid(el,n,key,onPick){const st=ls.get(key,{});el.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('button');const s=st[i]||0;if(s)b.className='done';b.innerHTML=(i+1)+'<small>'+(s?stars(s):'')+'</small>';b.onclick=()=>{snd.tap();onPick(i)};el.appendChild(b)}}
 function saveStars(key,i,s){const st=ls.get(key,{});if((st[i]||0)<s){st[i]=s;ls.set(key,st)}}
 function muteBtn(b){const u=()=>b.textContent=S.mute?'🔇':'🔊';b.onclick=()=>{S.mute=!S.mute;ls.set('g_mute',S.mute);u()};S.mute=!!ls.get('g_mute',false);u()}
 return {ls,$,snd,toast,overlay,name,askName,report,fmt,stars,levelGrid,saveStars,muteBtn,S};
})();


const GAME='Giải mã khóa',KEY='code_stars30';
const LV=[{"n": 3, "secret": "801", "clues": [["950", 0, 1], ["397", 0, 0], ["609", 1, 0], ["804", 2, 0], ["142", 0, 1]]}, {"n": 3, "secret": "568", "clues": [["531", 1, 0], ["910", 0, 0], ["650", 0, 2], ["738", 1, 0]]}, {"n": 3, "secret": "350", "clues": [["043", 0, 2], ["104", 0, 1], ["235", 0, 2], ["573", 0, 2]]}, {"n": 3, "secret": "475", "clues": [["735", 1, 1], ["481", 1, 0], ["036", 0, 0], ["152", 0, 1]]}, {"n": 3, "secret": "190", "clues": [["549", 0, 1], ["745", 0, 0], ["105", 1, 1], ["581", 0, 1]]}, {"n": 3, "secret": "436", "clues": [["439", 2, 0], ["362", 0, 2], ["719", 0, 0]]}, {"n": 3, "secret": "124", "clues": [["196", 1, 0], ["984", 1, 0], ["452", 0, 2]]}, {"n": 3, "secret": "936", "clues": [["539", 1, 1], ["426", 1, 0], ["914", 1, 0]]}, {"n": 4, "secret": "3127", "clues": [["9634", 0, 1], ["2310", 0, 3], ["2396", 0, 2], ["7184", 1, 1], ["1982", 0, 2]]}, {"n": 4, "secret": "9642", "clues": [["3654", 1, 1], ["5204", 0, 2], ["8142", 2, 0], ["2397", 0, 2], ["2706", 0, 2]]}, {"n": 4, "secret": "9347", "clues": [["2390", 1, 1], ["6917", 1, 1], ["6174", 0, 2], ["9843", 2, 1]]}, {"n": 4, "secret": "2618", "clues": [["8369", 0, 2], ["5624", 1, 1], ["2719", 2, 0], ["8576", 0, 2]]}, {"n": 4, "secret": "4937", "clues": [["3089", 0, 2], ["9634", 1, 2], ["9342", 0, 3], ["3742", 0, 3]]}, {"n": 4, "secret": "4906", "clues": [["6754", 0, 2], ["3259", 0, 1], ["4709", 2, 1], ["0475", 0, 2]]}, {"n": 4, "secret": "1832", "clues": [["4825", 1, 1], ["4538", 1, 1], ["1850", 2, 0], ["6370", 0, 1]]}, {"n": 4, "secret": "7248", "clues": [["7942", 2, 1], ["7683", 1, 1], ["9287", 1, 2]]}, {"n": 4, "secret": "0741", "clues": [["8791", 2, 0], ["8549", 1, 0], ["0268", 1, 0]]}, {"n": 4, "secret": "7810", "clues": [["0178", 0, 4], ["7526", 1, 0], ["5612", 1, 0]]}, {"n": 5, "secret": "69175", "clues": [["75286", 0, 3], ["13047", 0, 2], ["35761", 0, 4], ["57912", 0, 4], ["04715", 1, 2], ["94361", 0, 3]]}, {"n": 5, "secret": "93251", "clues": [["67218", 1, 1], ["75389", 0, 3], ["52963", 0, 4], ["68325", 0, 3], ["89316", 0, 3]]}, {"n": 5, "secret": "52794", "clues": [["51307", 1, 1], ["52481", 2, 1], ["65748", 1, 2], ["17829", 0, 3], ["62013", 1, 0]]}, {"n": 5, "secret": "45901", "clues": [["19502", 1, 3], ["15476", 1, 2], ["18794", 0, 3], ["09451", 1, 4], ["01497", 0, 4]]}, {"n": 5, "secret": "24358", "clues": [["07159", 1, 0], ["82693", 0, 3], ["15792", 0, 2], ["57201", 0, 2], ["04659", 2, 0]]}, {"n": 5, "secret": "16854", "clues": [["65470", 0, 3], ["16872", 3, 0], ["25046", 0, 3], ["07891", 1, 1]]}, {"n": 5, "secret": "05924", "clues": [["24980", 1, 3], ["98374", 1, 1], ["65829", 2, 1], ["67320", 1, 1]]}, {"n": 5, "secret": "28790", "clues": [["32467", 0, 2], ["31048", 0, 2], ["48735", 2, 0], ["37290", 2, 2]]}, {"n": 5, "secret": "52603", "clues": [["07614", 1, 1], ["42689", 2, 0], ["43185", 0, 2], ["83402", 1, 2]]}, {"n": 5, "secret": "73614", "clues": [["05749", 0, 2], ["70619", 3, 0], ["13057", 1, 2]]}, {"n": 5, "secret": "74952", "clues": [["71052", 3, 0], ["27845", 0, 4], ["95412", 1, 3]]}, {"n": 5, "secret": "54698", "clues": [["59684", 2, 3], ["51678", 3, 0]]}];
const app=G.$('app');let cur=0,ans=[],tries=0,t0=0,done=false;
const W=['không','một','hai','ba','bốn','năm'];
function txt(r,w){if(!r&&!w)return'Không có chữ số nào trong mã khóa.';if(r&&!w)return r===1?'Có một chữ số trong mã khóa và đúng vị trí.':`Có ${W[r]} chữ số trong mã khóa và đều đúng vị trí.`;if(!r&&w)return w===1?'Có một chữ số trong mã khóa nhưng sai vị trí.':`Có ${W[w]} chữ số trong mã khóa nhưng đều sai vị trí.`;return`Có ${W[r]} chữ số đúng vị trí và ${W[w]} chữ số có trong mã khóa nhưng sai vị trí.`}
function home(){app.innerHTML=`<div class="top"><h1>🔐 Giải mã khóa</h1><button class="btn sec" id="mu"></button></div>
<div class="card how"><b>Cách chơi:</b> mỗi dòng gợi ý là một lần thử mở khóa kèm lời nhận xét. Em suy luận để tìm ra mã khóa đúng, nhập vào ô và bấm “Mở khóa”. Mã khóa không có chữ số nào lặp lại. Bấm vào ô số của gợi ý để đánh dấu ✗ (loại) hoặc ✓ (có thể đúng).</div>
<div class="lv" id="lv"></div><p class="note">Màn 1–8: mã 3 chữ số. Màn 9–18: mã 4 chữ số. Màn 19–30: mã 5 chữ số. Càng về sau càng ít manh mối.</p>`;G.muteBtn(G.$('mu'));G.levelGrid(G.$('lv'),LV.length,KEY,i=>G.askName(()=>play(i)))}
function play(i){cur=i;const L=LV[i];ans=[];tries=0;done=false;t0=Date.now();
 app.innerHTML=`<div class="top"><button class="btn sec" id="bk">←</button><h1>Mật mã ${i+1} <small class="note">(${L.n} chữ số)</small></h1><button class="btn sec" id="mu"></button></div>
<div id="cl" style="display:flex;flex-direction:column;gap:8px"></div>
<div class="card" style="text-align:center"><b>Mã khóa là:</b><div class="slots" id="sl"></div>
<div class="pad" id="pd"></div><div class="row" style="margin-top:10px"><button class="btn sec" id="bs">⌫ Xóa</button><button class="btn ok" id="go">🔓 Mở khóa</button></div></div>`;
 G.muteBtn(G.$('mu'));G.$('bk').onclick=home;
 G.$('cl').innerHTML=L.clues.map(c=>`<div class="clue"><div class="tiles">${c[0].split('').map(d=>`<div class="tile" data-s="0">${d}</div>`).join('')}</div><div class="ctext">${txt(c[1],c[2])}</div></div>`).join('');
 document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const s=(+t.dataset.s+1)%3;t.dataset.s=s;t.className='tile'+(s===1?' x':s===2?' v':'');G.snd.tap()});
 G.$('pd').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(d=>`<button class="btn" data-d="${d}">${d}</button>`).join('');
 G.$('pd').onclick=e=>{const d=e.target.dataset&&e.target.dataset.d;if(d==null||done)return;if(ans.length<L.n&&!ans.includes(d)){ans.push(d);G.snd.tap();drawSlots()}else if(ans.includes(d))G.toast('Mã khóa không có chữ số lặp lại nhé',1500)};
 G.$('bs').onclick=()=>{ans.pop();drawSlots()};G.$('go').onclick=submit;drawSlots()}
function drawSlots(){const n=LV[cur].n;G.$('sl').innerHTML=Array.from({length:n},(_,i)=>`<div class="slot${i===ans.length?' on':''}">${ans[i]==null?'':ans[i]}</div>`).join('')}
function submit(){if(done)return;const L=LV[cur];if(ans.length<L.n){G.toast('Em nhập đủ '+L.n+' chữ số nhé');return}tries++;
 if(ans.join('')===L.secret){done=true;const sec=(Date.now()-t0)/1000,st=tries===1?3:tries<=3?2:1;G.snd.win();G.saveStars(KEY,cur,st);G.report(GAME,{level:cur+1,score:st*10,correct:st,total:3,attempts:tries,timeSec:Math.round(sec)});
  const nx=cur+1<LV.length;const o=G.overlay(`<h2>🔓 Khóa đã mở!</h2><div class="stars">${G.stars(st)}</div><p>Mã khóa là <b style="font-size:26px">${L.secret}</b><br>Em mở khóa sau ${tries} lần thử, thời gian ${G.fmt(sec)}.</p><div class="row"><button class="btn ok" id="o1">${nx?'Màn tiếp ➜':'Về chọn màn'}</button><button class="btn sec" id="o3">Chọn màn</button></div>`);
  G.$('o1').onclick=()=>{o.remove();nx?play(cur+1):home()};G.$('o3').onclick=()=>{o.remove();home()}}
 else{G.snd.bad();const s=G.$('sl');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');G.toast('Chưa đúng, em đọc lại các gợi ý nhé!',1800)}}
home();
</script></body></html>
