<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Xếp que diêm</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8e6;color:#3b2a14;background-image:radial-gradient(#f3e3b8 1.5px,transparent 1.5px);background-size:22px 22px;display:flex;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:560px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.15}
.btn{min-height:48px;min-width:48px;border:0;border-radius:14px;background:#2f6fe0;color:#fff;font-size:17px;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #1d4ea8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ea8}
.btn.sec{background:#fff;color:#2f6fe0;border:2px solid #2f6fe0;box-shadow:0 4px 0 #b9cdf3}
.btn.ok{background:#27a95b;box-shadow:0 4px 0 #1b7d41}
.btn.warn{background:#f59e0b;box-shadow:0 4px 0 #b97500}
.btn[disabled]{opacity:.45}
.card{background:#fff;border:3px solid #f1d58a;border-radius:20px;padding:12px}
.how{font-size:15px;line-height:1.45}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#fff;border:2px solid #f1d58a;border-radius:14px;text-align:center;padding:6px 4px}
.stat small{display:block;font-size:12px;color:#8a6a2a;font-weight:700;text-transform:uppercase}
.stat b{font-size:22px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv button{min-height:72px;border-radius:16px;border:3px solid #f1d58a;background:#fff;font-size:22px;font-weight:800;color:#3b2a14;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv button small{font-size:15px;letter-spacing:1px;color:#f59e0b;min-height:18px}
.lv button.done{background:#eafbe9;border-color:#7ed28a}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(40,25,5,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov .box{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:100%;text-align:center;border:4px solid #f1d58a}
.ov h2{margin:0 0 6px;font-size:26px}
.stars{font-size:46px;letter-spacing:4px;color:#f59e0b}
input.tx{width:100%;min-height:48px;border:3px solid #f1d58a;border-radius:14px;font-size:18px;padding:0 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2a14;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:92%;text-align:center}
.hide{display:none!important}
.note{font-size:13px;color:#8a6a2a}


#bd{width:100%;max-width:520px;margin:0 auto;background:#fff;border:3px solid #f1d58a;border-radius:16px;touch-action:manipulation;user-select:none;padding:8px 4px}
#bd svg{width:100%;display:block}
.hand{font-size:16px;text-align:center;min-height:24px;font-weight:700;color:#b45309}
</style></head><body><div id="app"></div>
<script>const G=(()=>{
 const S={mute:false,ctx:null};
 const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
 const $=id=>document.getElementById(id);
 function tone(f,d,t,v){try{if(S.mute)return;S.ctx=S.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=S.ctx,o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.08;o.connect(g);g.connect(c.destination);const n=c.currentTime;g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
 const snd={ok(){tone(660,.12);setTimeout(()=>tone(880,.16),110)},bad(){tone(200,.25,'sawtooth',.06)},tap(){tone(500,.05,'triangle',.05)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*130))}};
 function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}
 function overlay(html){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(o);return o}
 function name(){return ls.get('g_name','')}
 function askName(cb){if(name()){cb&&cb();return}const o=overlay('<h2>Em tên là gì?</h2><p class="note">Để cô biết ai đang chơi nhé.</p><input class="tx" id="gnm" maxlength="30" placeholder="Nhập tên của em"><div class="row" style="margin-top:12px"><button class="btn ok" id="gok">Bắt đầu</button><button class="btn sec" id="gsk">Bỏ qua</button></div>');
  const done=()=>{const v=$('gnm').value.trim();if(v)ls.set('g_name',v);o.remove();cb&&cb()};$('gok').onclick=done;$('gsk').onclick=()=>{o.remove();cb&&cb()};$('gnm').onkeydown=e=>{if(e.key==='Enter')done()}}
 function report(game,r){try{parent.postMessage(Object.assign({type:'game-result',game:game,name:name()},r),'*')}catch(e){}}
 function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
 function levelGrid(el,n,key,onPick){const st=ls.get(key,{});el.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('button');const s=st[i]||0;if(s)b.className='done';b.innerHTML=(i+1)+'<small>'+(s?stars(s):'')+'</small>';b.onclick=()=>{snd.tap();onPick(i)};el.appendChild(b)}}
 function saveStars(key,i,s){const st=ls.get(key,{});if((st[i]||0)<s){st[i]=s;ls.set(key,st)}}
 function muteBtn(b){const u=()=>b.textContent=S.mute?'🔇':'🔊';b.onclick=()=>{S.mute=!S.mute;ls.set('g_mute',S.mute);u()};S.mute=!!ls.get('g_mute',false);u()}
 return {ls,$,snd,toast,overlay,name,askName,report,fmt,stars,levelGrid,saveStars,muteBtn,S};
})();


const GAME='Xếp que diêm',KEY='match_stars30';
const LV=[{"eq":"7-2=4","k":1,"sol":["7-3=4"]},{"eq":"5-0=3","k":1,"sol":["3-0=3","5-0=5"]},{"eq":"0+0=9","k":1,"sol":["0+0=0","0+9=9","9+0=9"]},{"eq":"7+7=0","k":1,"sol":["1+7=8","7+1=8"]},{"eq":"2-1=2","k":1,"sol":["3-1=2"]},{"eq":"2+8=6","k":1,"sol":["2+6=8"]},{"eq":"6+9=2","k":2,"sol":["6+3=9","8-6=2"]},{"eq":"2-1=4","k":2,"sol":["5-1=4"]},{"eq":"5-0=0","k":2,"sol":["5+0=5"]},{"eq":"3-9=5","k":2,"sol":["2+3=5","3+2=5","3-0=3"]},{"eq":"9+9=8","k":2,"sol":["8-0=8","8-8=0"]},{"eq":"7+7=5","k":2,"sol":["7-7=0"]},{"eq":"6+5=1","k":3,"sol":["2+5=7","5+2=7"]},{"eq":"5-5=1","k":3,"sol":["3-2=1"]},{"eq":"9-5=2","k":3,"sol":["2-0=2","3-0=3","5-5=0"]},{"eq":"9-2=2","k":3,"sol":["3+2=5","6-3=3"]},{"eq":"2-2=2","k":3,"sol":["5-2=3","5-3=2"]},{"eq":"0-5=5","k":3,"sol":["5-0=5","5-5=0","6-3=3"]},{"eq":"76+11=21","k":1,"sol":["16+11=27"]},{"eq":"19+10=39","k":1,"sol":["19+10=29"]},{"eq":"14+12=36","k":1,"sol":["14+12=26"]},{"eq":"19-14=27","k":1,"sol":["13+14=27"]},{"eq":"11-3=6","k":1,"sol":["11-5=6"]},{"eq":"18+6=27","k":1,"sol":["18+9=27","19+8=27"]},{"eq":"17-12=25","k":2,"sol":["11+12=23"]},{"eq":"11+12=32","k":2,"sol":["11+12=23"]},{"eq":"75-0=13","k":2,"sol":["13+0=13","15+0=15","19-6=13"]},{"eq":"79-5=1","k":2,"sol":["10-9=1","13-6=7"]},{"eq":"15+9=32","k":2,"sol":["13+9=22","19+3=22"]},{"eq":"14+75=24","k":2,"sol":["14+10=24"]}];
const SEG={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'};
const INV={};Object.keys(SEG).forEach(d=>INV[SEG[d].split('').sort().join('')]=d);
// geometry of a digit (width 50, height 90): [x,y,w,h]
const GEO={a:[8,2,34,8],d:[8,80,34,8],g:[8,41,34,8],f:[0,8,8,34],b:[42,8,8,34],e:[0,48,8,34],c:[42,48,8,34]};
const app=G.$('app');let cur=0,L,sym,lit,hand,moves,hist,t0=0,done=false,tries=0,hinted=false;
function home(){app.innerHTML=`<div class="top"><h1>🔥 Xếp que diêm</h1><button class="btn sec" id="mu"></button></div>
<div class="card how"><b>Cách chơi:</b> phép tính đang <b>sai</b>. Hãy <b>di chuyển đúng số que diêm</b> cho trước để phép tính thành <b>đúng</b>. Chạm vào một que diêm để nhấc lên, rồi chạm vào chỗ trống (nét mờ) để đặt xuống. Có thể biến dấu + thành dấu − bằng cách lấy que dọc ra, và ngược lại.</div>
<div class="lv" id="lv"></div><p class="note">Màn 1–6: di chuyển 1 que. Màn 7–12: 2 que. Màn 13–18: 3 que. Màn 19–24: số có hai chữ số, di chuyển 1 que. Màn 25–30: số có hai chữ số, di chuyển 2 que.</p>`;G.muteBtn(G.$('mu'));G.levelGrid(G.$('lv'),LV.length,KEY,i=>G.askName(()=>play(i)))}
function build(eq){sym=[];lit=[];[...eq].forEach((ch,i)=>{if(/\d/.test(ch)){sym.push({t:'d',ch});SEG[ch].split('').forEach(()=>{});'abcdefg'.split('').forEach(s=>lit.push({i,s,on:SEG[ch].includes(s)}))}else if(ch==='+'||ch==='-'){sym.push({t:'o',ch});lit.push({i,s:'h',on:true});lit.push({i,s:'v',on:ch==='+'})}else sym.push({t:'e',ch})})}
function play(i){cur=i;L=LV[i];build(L.eq);hand=-1;moves=0;hist=[];t0=Date.now();done=false;tries=0;hinted=false;
 app.innerHTML=`<div class="top"><button class="btn sec" id="bk">←</button><h1>Màn ${i+1}: chuyển ${L.k} que</h1><button class="btn sec" id="mu"></button></div>
<div class="stats"><div class="stat"><small>Số lần đã chuyển</small><b id="mv">0/${L.k}</b></div><div class="stat"><small>Thời gian</small><b id="tt">0:00</b></div></div>
<div id="bd"></div><div class="hand" id="hd"></div>
<div class="row"><button class="btn sec" id="un">↩ Đi lùi</button><button class="btn sec" id="rs">↺ Làm lại</button><button class="btn warn" id="hn">💡 Gợi ý</button></div>`;
 G.muteBtn(G.$('mu'));G.$('bk').onclick=home;G.$('rs').onclick=()=>{tries++;build(L.eq);hand=-1;moves=0;hist=[];draw()};G.$('un').onclick=undo;G.$('hn').onclick=()=>{hinted=true;G.toast('Một đáp án: '+L.sol[0].replace('-','−'),4000)};
 const tm=setInterval(()=>{if(!G.$('tt')||done){clearInterval(tm);return}G.$('tt').textContent=G.fmt((Date.now()-t0)/1000)},500);
 G.$('bd').onclick=e=>{const t=e.target.closest('[data-k]');if(t&&!done)tap(+t.dataset.k)};draw()}
function value(){let s='';for(let i=0;i<sym.length;i++){const y=sym[i];if(y.t==='e'){s+='=';continue}
  const m=lit.filter(x=>x.i===i&&x.on).map(x=>x.s);if(y.t==='d'){const d=INV[m.sort().join('')];if(d===undefined)return null;s+=d}else{const h=m.includes('h'),v=m.includes('v');if(h&&v)s+='+';else if(h)s+='-';else return null}}return s}
function ok(s){if(!s)return false;try{const[l,r]=s.split('=');for(const tk of l.replace(/[+-]/,' ').split(' ').concat([r]))if(tk.length>1&&tk[0]==='0')return false;let v;if(l.includes('+')){const[a,b]=l.split('+');v=+a+ +b}else{const[a,b]=l.split('-');v=a-b}return v===+r}catch(e){return false}}
function tap(k){const x=lit[k];
 if(hand<0){if(!x.on)return;if(moves>=L.k){G.toast('Đã dùng hết '+L.k+' lần chuyển. Bấm "Đi lùi" hoặc "Làm lại" nhé');G.snd.bad();return}hand=k;x.on=false;G.snd.tap();draw();return}
 if(x.on)return;x.on=true;const from=hand;hand=-1;if(from!==k){moves++;hist.push([from,k])}G.snd.tap();draw();
 if(moves>0&&ok(value()))win();else if(moves>=L.k&&from!==k){tries++;G.toast('Chưa đúng rồi, em thử cách khác nhé');G.snd.bad()}}
function undo(){if(done)return;if(hand>=0){lit[hand].on=true;hand=-1;draw();return}const h=hist.pop();if(!h)return;lit[h[1]].on=false;lit[h[0]].on=true;moves--;tries++;draw()}
function stick(x,y,w,h,k,state){const vert=h>w;const col=state==='on'?'#c98a3b':state==='hand'?'#fbc02d':'none';
 let s=`<g data-k="${k}" style="cursor:pointer"><rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+12}" fill="transparent"/>`;
 if(state==='off')s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#f7efd6" stroke="#d9c58a" stroke-dasharray="3 3"/>`;
 else{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${col}" stroke="#7a4a12" stroke-width="1.2"/>`;
  s+=vert?`<rect x="${x}" y="${y}" width="${w}" height="9" rx="4" fill="#e53935"/>`:`<rect x="${x}" y="${y}" width="9" height="${h}" rx="4" fill="#e53935"/>`}
 return s+'</g>'}
function draw(){const GAP=14;let x=0,s='';const parts=[];
 sym.forEach((y,i)=>{if(y.t==='d'){parts.push({i,w:50});}else if(y.t==='o')parts.push({i,w:50});else parts.push({i,w:50})});
 const W=parts.length*64;let body='';
 parts.forEach((p,pi)=>{const ox=pi*64+4,y=sym[p.i];
  if(y.t==='d'){lit.forEach((q,k)=>{if(q.i!==p.i)return;const g=GEO[q.s];body+=`<g transform="translate(${ox},4)">`+stick(g[0],g[1],g[2],g[3],k,hand===k?'off':q.on?'on':'off')+'</g>'})}
  else if(y.t==='o'){lit.forEach((q,k)=>{if(q.i!==p.i)return;const g=q.s==='h'?[8,41,34,8]:[21,28,8,34];body+=`<g transform="translate(${ox},4)">`+stick(g[0],g[1],g[2],g[3],k,hand===k?'off':q.on?'on':'off')+'</g>'})}
  else{body+=`<g transform="translate(${ox},4)">`+stick(8,30,34,8,-1,'on').replace('data-k="-1"','')+stick(8,54,34,8,-1,'on').replace('data-k="-1"','')+'</g>'}});
 G.$('bd').innerHTML=`<svg viewBox="0 0 ${W} 100">${body}</svg>`;G.$('mv').textContent=moves+'/'+L.k;G.$('hd').textContent=hand>=0?'✋ Đang cầm 1 que — chạm vào chỗ trống (nét mờ) để đặt':''}
function win(){done=true;const sec=(Date.now()-t0)/1000,st=!hinted&&tries===0?3:!hinted&&tries<=2?2:1;G.snd.win();G.saveStars(KEY,cur,st);G.report(GAME,{level:cur+1,score:st*10,correct:st,total:3,timeSec:Math.round(sec)});
 const nx=cur+1<LV.length;const o=G.overlay(`<h2>🎉 Đúng rồi!</h2><div class="stars">${G.stars(st)}</div><p><b>${value().replace('-','−')}</b></p><div class="row"><button class="btn ok" id="o1">${nx?'Màn tiếp ➜':'Về chọn màn'}</button><button class="btn sec" id="o3">Chọn màn</button></div>`);
 G.$('o1').onclick=()=>{o.remove();nx?play(cur+1):home()};G.$('o3').onclick=()=>{o.remove();home()}}
home();
</script></body></html>
