<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Khối hình 3D</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--pri:#2563eb;--line:#dbe3f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{-webkit-user-select:none;user-select:none;background:#f1f5fb;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#wrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.btn{border:0;border-radius:12px;background:#e8eefb;color:#1e3a8a;font-weight:700;font-size:15px;min-height:40px;padding:0 12px;cursor:pointer;font-family:inherit}
.btn.on{background:var(--pri);color:#fff}
.btn:active{filter:brightness(.92)}
.btn.sm{min-height:34px;font-size:14px;padding:0 10px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{border:2px solid transparent;border-radius:12px;background:#eef2fb;color:#1e293b;font-weight:700;font-size:14px;min-height:38px;padding:0 11px;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{background:#dbeafe;border-color:var(--pri);color:#1d4ed8}
#main{flex:1;min-height:0;display:flex}
#stage{position:relative;flex:1;min-width:0;background:linear-gradient(#fff,#e7eefb)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
canvas.paint{cursor:crosshair}
#hud{position:absolute;left:10px;top:8px;font-size:15px;font-weight:700;pointer-events:none;line-height:1.35;max-width:70%}
#hud small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
#vb{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 6px}
#vb .btn{background:#fffd;box-shadow:0 1px 4px #0002;min-height:34px;font-size:13.5px;padding:0 10px}
#panel{width:350px;overflow:auto;background:#fff;border-left:1px solid var(--line);padding:10px 12px;font-size:14.5px;line-height:1.45}
#panel h3{margin:12px 0 6px;font-size:14px;color:#334155}
#panel h3:first-child{margin-top:0}
.sl{display:flex;align-items:center;gap:8px;margin:5px 0}
.sl label{flex:0 0 118px;font-weight:600;font-size:14px}
.sl input[type=range]{flex:1;min-width:0}
.sl b{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:9px;border:3px solid #fff;box-shadow:0 0 0 1.5px #94a3b8;cursor:pointer;padding:0;font-size:15px;background:#fff}
.sw.on{box-shadow:0 0 0 3px var(--pri)}
.info{background:#f1f5fb;border-radius:12px;padding:9px 11px;margin-top:6px}
.info table{width:100%;border-collapse:collapse}
.info td{padding:2px 0;vertical-align:top}
.info td:last-child{text-align:right;font-weight:700}
.note{color:var(--mut);font-size:13px}
#nets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.nt{border:2px solid var(--line);border-radius:10px;background:#fff;padding:3px;cursor:pointer;width:62px;height:50px}
.nt.on{border-color:var(--pri);background:#eff6ff}
.nt svg{width:100%;height:100%}
@media(max-width:899px){#main{flex-direction:column}#panel{width:auto;max-height:44vh;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:600px){header{padding:5px 8px}header h1{font-size:16px}.btn{font-size:14px;min-height:36px}#vb .btn{font-size:12.5px;padding:0 8px;min-height:32px}.sl label{flex-basis:96px;font-size:13px}#hud{font-size:14px}}
</style></head>
<body><div id="wrap">
<header><h1>🧊 Khối hình 3D</h1><button class="btn sm" id="fs" title="Toàn màn hình">⛶</button></header>
<div id="chips"></div>
<div id="main">
 <div id="stage"><canvas id="cv"></canvas><div id="hud"></div>
  <div id="vb"><button class="btn" data-v="front">Trước</button><button class="btn" data-v="right">Phải</button><button class="btn" data-v="back">Sau</button><button class="btn" data-v="left">Trái</button><button class="btn" data-v="top">Trên</button><button class="btn" data-v="bottom">Dưới</button><button class="btn" data-v="iso">↺ Đặt lại</button></div>
 </div>
 <aside id="panel">
  <h3>Kích thước</h3><div id="params"></div>
  <h3>Hiển thị</h3><div class="tg" id="tg"></div>
  <div id="boxOnly">
   <h3>🎨 Tô ô vuông trên các mặt</h3>
   <div class="pal" id="pal"></div>
   <p class="note" style="margin:6px 0 0">Chọn một màu rồi bấm hoặc kéo trên các ô. Chọn 🖐 để xoay khối. <button class="btn sm" id="clr">Xóa hết màu</button></p>
   <div id="netBox"><h3>🗺️ Khai triển lập phương</h3>
    <div class="tg"><button class="btn sm" id="netOn">Mở khai triển</button><button class="btn sm" id="netPlay" style="display:none">▶ Gấp / Mở</button></div>
    <div id="nets" style="display:none"></div>
    <div class="sl" id="foldSl" style="display:none"><label>Gấp ⇄ Mở</label><input type="range" id="fold" min="0" max="100" value="100"></div>
   </div>
  </div>
  <h3>Thông tin</h3><div class="info" id="info"></div>
  <p class="note" id="foot"></p>
 </aside>
</div></div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),g=cv.getContext('2d');
let VW=100,VH=100,DPR=1,dirty=true;
function fit(){const r=cv.parentElement.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);VW=Math.max(100,r.width);VH=Math.max(100,r.height);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);g.setTransform(DPR,0,0,DPR,0,0);dirty=true}
new ResizeObserver(fit).observe(cv.parentElement);
// ---------- toán véc-tơ
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]),unit=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
// ---------- trạng thái
const SHAPES=[
 {id:'cube',e:'🧊',t:'Lập phương',p:[{k:'n',l:'Cạnh (số ô)',min:1,max:10,step:1}]},
 {id:'box',e:'📦',t:'Hộp chữ nhật',p:[{k:'a',l:'Dài',min:1,max:10,step:1},{k:'b',l:'Rộng',min:1,max:10,step:1},{k:'c',l:'Cao',min:1,max:10,step:1}]},
 {id:'prism',e:'🧱',t:'Lăng trụ',p:[{k:'ns',l:'Số cạnh đáy',min:3,max:8,step:1},{k:'R',l:'Bán kính đáy',min:1,max:3,step:.25},{k:'h',l:'Chiều cao',min:1,max:5,step:.25}]},
 {id:'pyr',e:'🔺',t:'Hình chóp',p:[{k:'ns',l:'Số cạnh đáy',min:3,max:8,step:1},{k:'R',l:'Bán kính đáy',min:1,max:3,step:.25},{k:'h',l:'Chiều cao',min:1,max:5,step:.25}]},
 {id:'frus',e:'🏺',t:'Chóp cụt',p:[{k:'ns',l:'Số cạnh đáy',min:3,max:8,step:1},{k:'R',l:'Bán kính đáy lớn',min:1,max:3,step:.25},{k:'r2',l:'Bán kính đáy nhỏ',min:.25,max:2.5,step:.25},{k:'h',l:'Chiều cao',min:1,max:5,step:.25}]},
 {id:'tetra',e:'🔻',t:'Tứ diện đều',p:[]},
 {id:'octa',e:'💎',t:'Bát diện đều',p:[]},
 {id:'dode',e:'⬟',t:'Thập nhị diện đều',p:[]},
 {id:'icosa',e:'⚽',t:'Nhị thập diện đều',p:[]},
 {id:'cyl',e:'🥫',t:'Hình trụ',p:[{k:'r',l:'Bán kính đáy',min:1,max:4,step:.5},{k:'h',l:'Chiều cao',min:1,max:6,step:.5}]},
 {id:'cone',e:'🍦',t:'Hình nón',p:[{k:'r',l:'Bán kính đáy',min:1,max:4,step:.5},{k:'h',l:'Chiều cao',min:1,max:6,step:.5}]},
 {id:'sph',e:'🔴',t:'Hình cầu',p:[{k:'r',l:'Bán kính',min:1,max:4,step:.5}]}];
const BASE={cube:'#dbeafe',box:'#dbeafe',prism:'#fde68a',pyr:'#bbf7d0',frus:'#fbcfe8',tetra:'#fecaca',octa:'#c7d2fe',dode:'#fed7aa',icosa:'#a5f3fc',cyl:'#fcd34d',cone:'#fda4af',sph:'#93c5fd'};
const NAMEN={3:'tam giác',4:'tứ giác',5:'ngũ giác',6:'lục giác',7:'thất giác',8:'bát giác'};
const S={shape:'cube',n:3,a:4,b:3,c:2,ns:4,R:2,h:3,r2:1,r:2,
 yaw:-.62,pitch:.5,zoom:1,labels:true,hidden:true,solid:true,trans:false,grid:true,faceNo:false,auto:false,
 tool:0,net:-1,fold:1,netOpen:false};
const ISO={yaw:-.62,pitch:.5};
const PAL=['','#ef4444','#f97316','#facc15','#22c55e','#38bdf8','#6366f1','#a855f7','#111827'];
const PT={};            // màu các ô: PT['a,s'][iu][iv] = chỉ số màu
// ---------- máy ảnh
let cy_=1,sy_=0,cp_=1,sp_=0;
function camSet(){cy_=Math.cos(S.yaw);sy_=Math.sin(S.yaw);cp_=Math.cos(S.pitch);sp_=Math.sin(S.pitch)}
function R3(p){const x=p[0]*cy_-p[2]*sy_,z1=p[0]*sy_+p[2]*cy_;return[x,p[1]*cp_-z1*sp_,p[1]*sp_+z1*cp_]}
// ---------- bao lồi (tìm các mặt từ tập đỉnh)
function hull(V){const n=V.length,faces=[],seen=new Set(),eps=1e-6;
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++){
  let N=cross(sub(V[j],V[i]),sub(V[k],V[i]));const l=len(N);if(l<1e-9)continue;N=mul(N,1/l);const d=dot(N,V[i]);let pos=0,neg=0;const on=[];
  for(let m=0;m<n;m++){const s=dot(N,V[m])-d;if(s>eps)pos++;else if(s<-eps)neg++;else on.push(m)}
  if(pos&&neg)continue;const key=on.join(',');if(seen.has(key))continue;seen.add(key);if(pos>0)N=mul(N,-1);
  let c=[0,0,0];on.forEach(m=>c=add(c,V[m]));c=mul(c,1/on.length);const u=unit(sub(V[on[0]],c)),w=cross(N,u);
  on.sort((p,q)=>Math.atan2(dot(sub(V[p],c),w),dot(sub(V[p],c),u))-Math.atan2(dot(sub(V[q],c),w),dot(sub(V[q],c),u)));
  faces.push({idx:on,N})}
 return faces}
function edgesOf(F){const m=new Map();F.forEach((f,fi)=>{const L=f.idx.length;for(let k=0;k<L;k++){const a=f.idx[k],b=f.idx[(k+1)%L],key=a<b?a+'-'+b:b+'-'+a;let e=m.get(key);if(!e){e={a:Math.min(a,b),b:Math.max(a,b),f:[]};m.set(key,e)}e.f.push(fi)}});return[...m.values()]}
const LET='ABCDEFGHIJKLMNOPQRST';
const ringL=(n,pre)=>Array.from({length:n},(_,k)=>LET[k]+(pre||''));
function finish(m){m.E=edgesOf(m.F);m.Rm=Math.max(...m.V.map(len))||1;return m}
// ---------- dựng khối
function ngon(n,R,y){return Array.from({length:n},(_,k)=>{const t=3*Math.PI/4-2*Math.PI*k/n;return[R*Math.cos(t),y,R*Math.sin(t)]})}
function build(){
 const id=S.shape;let m;
 if(id==='cube'||id==='box'){const d=id==='cube'?[S.n,S.n,S.n]:[S.a,S.c,S.b];const x=d[0]/2,y=d[1]/2,z=d[2]/2;
  m={kind:'box',dims:d,V:[[-x,-y,z],[x,-y,z],[x,-y,-z],[-x,-y,-z],[-x,y,z],[x,y,z],[x,y,-z],[-x,y,-z]],L:['A','B','C','D',"A'","B'","C'","D'"]};
  m.F=hull(m.V);m.F.forEach(f=>{const a=f.N.findIndex(q=>Math.abs(q)>.5);f.ax=a;f.sd=f.N[a]>0?1:-1});
  // đổi kích thước thì giữ màu các ô còn trong phạm vi
  for(let a=0;a<3;a++)for(const s of[-1,1]){const[p,q]=pq(a),nu=d[p],nv=d[q],key=a+','+s,old=PT[key]||[],nw=[];for(let i=0;i<nu;i++){nw.push([]);for(let j=0;j<nv;j++)nw[i].push((old[i]&&old[i][j])||0)}PT[key]=nw}}
 else if(id==='prism'){const n=S.ns,b=ngon(n,S.R,-S.h/2),t=ngon(n,S.R,S.h/2);m={kind:'poly',V:b.concat(t),L:ringL(n).concat(ringL(n,"'"))};m.F=hull(m.V)}
 else if(id==='pyr'){const n=S.ns,b=ngon(n,S.R,-S.h/2);m={kind:'poly',V:b.concat([[0,S.h/2,0]]),L:ringL(n).concat(['S'])};m.F=hull(m.V)}
 else if(id==='frus'){const n=S.ns,r2=Math.min(S.r2,S.R-.25),b=ngon(n,S.R,-S.h/2),t=ngon(n,r2,S.h/2);m={kind:'poly',V:b.concat(t),L:ringL(n).concat(ringL(n,"'"))};m.F=hull(m.V)}
 else if(id==='tetra'){const s=2.1,b=ngon(3,s*2*Math.SQRT2/3,-s/3);m={kind:'poly',V:b.concat([[0,s,0]]),L:['A','B','C','D']};m.F=hull(m.V)}
 else if(id==='octa'){const s=2;m={kind:'poly',V:[[s,0,0],[0,0,s],[-s,0,0],[0,0,-s],[0,s,0],[0,-s,0]],L:['A','B','C','D','E','F']};m.F=hull(m.V)}
 else if(id==='dode'){const f=(1+Math.sqrt(5))/2,q=1/f,V=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1])V.push([x,y,z]);for(const a of[-1,1])for(const b of[-1,1]){V.push([0,a*q,b*f]);V.push([a*q,b*f,0]);V.push([a*f,0,b*q])}m={kind:'poly',V:V.map(v=>mul(v,1.25)),L:Array.from({length:20},(_,i)=>LET[i])};m.F=hull(m.V)}
 else if(id==='icosa'){const f=(1+Math.sqrt(5))/2,V=[];for(const a of[-1,1])for(const b of[-1,1]){V.push([0,a,b*f]);V.push([a,b*f,0]);V.push([a*f,0,b])}m={kind:'poly',V:V.map(v=>mul(v,1.45)),L:Array.from({length:12},(_,i)=>LET[i])};m.F=hull(m.V)}
 else if(id==='cyl'||id==='cone'){const N=56,r=S.r,h=S.h,b=ngon(N,r,-h/2).map(v=>[v[0],v[1],v[2]]);let V=b.slice(),F=[];
  if(id==='cyl'){const t=ngon(N,r,h/2);V=V.concat(t);for(let i=0;i<N;i++){const j=(i+1)%N;F.push({idx:[i,j,N+j,N+i],side:true})}F.push({idx:Array.from({length:N},(_,i)=>N-1-i),cap:true});F.push({idx:Array.from({length:N},(_,i)=>N+i),cap:true})}
  else{V.push([0,h/2,0]);for(let i=0;i<N;i++){const j=(i+1)%N;F.push({idx:[i,j,N],side:true})}F.push({idx:Array.from({length:N},(_,i)=>N-1-i),cap:true})}
  F.forEach(f=>{const a=V[f.idx[0]],bb=V[f.idx[1]],c=V[f.idx[2]];let Nn=unit(cross(sub(bb,a),sub(c,a)));let ce=[0,0,0];f.idx.forEach(i=>ce=add(ce,V[i]));ce=mul(ce,1/f.idx.length);if(dot(Nn,ce)<0&&!f.cap){f.idx.reverse();Nn=mul(Nn,-1)}
   if(f.cap){const up=ce[1]>0;const want=up?[0,1,0]:[0,-1,0];if(dot(Nn,want)<0){f.idx.reverse();Nn=mul(Nn,-1)}}f.N=Nn});
  m={kind:'smooth',V,F,L:[]}}
 else if(id==='sph'){m={kind:'sph',V:[],F:[],L:[],r:S.r}}
 if(!m.E&&m.F.length)m.E=edgesOf(m.F);
 m.Rm=id==='sph'?S.r:Math.max(...m.V.map(len))||1;
 return m}
function pq(a){return a===0?[2,1]:a===1?[0,2]:[0,1]}
let M=build();
function rebuild(){M=build();dirty=true;panelInfo()}
// ---------- tô màu
function cget(a,s,i,j){const t=PT[a+','+s];return t&&t[i]?t[i][j]||0:0}
function cset(a,s,i,j,v){const t=PT[a+','+s];if(t&&t[i]&&j>=0&&j<t[i].length&&t[i][j]!==v){t[i][j]=v;dirty=true}}
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function shade(hex,f){const c=hex2rgb(hex);return`rgb(${Math.round(c[0]*f)},${Math.round(c[1]*f)},${Math.round(c[2]*f)})`}
// ---------- 11 lưới của hình lập phương (tìm bằng lăn khối)
function norm(c){let mr=Math.min(...c.map(x=>x[0])),mc=Math.min(...c.map(x=>x[1]));return c.map(([r,q])=>[r-mr,q-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function key(c){return norm(c).map(x=>x.join(',')).join(';')}
function syms(c){const out=[];let cur=c;for(let f=0;f<2;f++){for(let r=0;r<4;r++){out.push(norm(cur));cur=cur.map(([a,b])=>[b,-a])}cur=cur.map(([a,b])=>[a,-b])}return out}
function canon(c){return syms(c).map(key).sort()[0]}
function foldOK(c){const set=new Map(c.map(x=>[x[0]+','+x[1],1]));const face={};
 const roll=(o,d)=>{const[b,t,n,s,e,w]=o;return d==='N'?[n,s,t,b,e,w]:d==='S'?[s,n,b,t,e,w]:d==='E'?[e,w,n,s,t,b]:[w,e,n,s,b,t]};
 const st=[[c[0][0],c[0][1],[0,1,2,3,4,5]]];face[c[0][0]+','+c[0][1]]=0;const seen=new Set([c[0][0]+','+c[0][1]]);
 while(st.length){const[r,q,o]=st.pop();for(const[d,dr,dq]of[['N',-1,0],['S',1,0],['E',0,1],['W',0,-1]]){const k=(r+dr)+','+(q+dq);if(!set.has(k)||seen.has(k))continue;const no=roll(o,d);seen.add(k);face[k]=no[0];st.push([r+dr,q+dq,no])}}
 return new Set(Object.values(face)).size===6}
const NETS=(()=>{let cur=new Map([[canon([[0,0]]),[[0,0]]]]);for(let n=1;n<6;n++){const nx=new Map();cur.forEach(c=>{c.forEach(([r,q])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const t=[r+a,q+b];if(c.some(x=>x[0]===t[0]&&x[1]===t[1]))return;const nc=c.concat([t]);const k=canon(nc);if(!nx.has(k))nx.set(k,norm(nc))}))});cur=nx}
 const all=[...cur.values()].filter(foldOK);
 const rowsOf=c=>{const m={};c.forEach(x=>m[x[0]]=(m[x[0]]||0)+1);return Object.keys(m).sort((a,b)=>a-b).map(k=>m[k]).join('')};
 const ord={'141':0,'231':1,'222':2,'33':3};all.sort((a,b)=>(ord[rowsOf(a)]??9)-(ord[rowsOf(b)]??9)||key(a).localeCompare(key(b)));return all})();
// dựng cây gấp cho một lưới
const NETCACHE={};
function netData(i,n){const k=i+'/'+n;if(NETCACHE[k])return NETCACHE[k];const cells=NETS[i],idx=new Map(cells.map((c,j)=>[c[0]+','+c[1],j]));
