<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sandwich Sudoku</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8e6;color:#3b2a14;background-image:radial-gradient(#f3e3b8 1.5px,transparent 1.5px);background-size:22px 22px;display:flex;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:560px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.15}
.btn{min-height:48px;min-width:48px;border:0;border-radius:14px;background:#2f6fe0;color:#fff;font-size:17px;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #1d4ea8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ea8}
.btn.sec{background:#fff;color:#2f6fe0;border:2px solid #2f6fe0;box-shadow:0 4px 0 #b9cdf3}
.btn.ok{background:#27a95b;box-shadow:0 4px 0 #1b7d41}
.btn.warn{background:#f59e0b;box-shadow:0 4px 0 #b97500}
.btn[disabled]{opacity:.45}
.card{background:#fff;border:3px solid #f1d58a;border-radius:20px;padding:12px}
.how{font-size:15px;line-height:1.45}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#fff;border:2px solid #f1d58a;border-radius:14px;text-align:center;padding:6px 4px}
.stat small{display:block;font-size:12px;color:#8a6a2a;font-weight:700;text-transform:uppercase}
.stat b{font-size:22px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv button{min-height:72px;border-radius:16px;border:3px solid #f1d58a;background:#fff;font-size:22px;font-weight:800;color:#3b2a14;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv button small{font-size:15px;letter-spacing:1px;color:#f59e0b;min-height:18px}
.lv button.done{background:#eafbe9;border-color:#7ed28a}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(40,25,5,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov .box{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:100%;text-align:center;border:4px solid #f1d58a}
.ov h2{margin:0 0 6px;font-size:26px}
.stars{font-size:46px;letter-spacing:4px;color:#f59e0b}
input.tx{width:100%;min-height:48px;border:3px solid #f1d58a;border-radius:14px;font-size:18px;padding:0 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2a14;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:92%;text-align:center}
.hide{display:none!important}
.note{font-size:13px;color:#8a6a2a}


#gr{display:grid;gap:0;margin:0 auto;width:100%;max-width:420px;user-select:none}
.cl{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#d97706;font-size:20px}
.ce{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:#fff;border:1px solid #cbb26b;cursor:pointer}
.ce.g{background:#fdf0cc;color:#3b2a14;cursor:default}
.ce.u{color:#2f6fe0}
.ce.sel{background:#cfe0ff}
.ce.bad{color:#d62828;background:#ffe3e1}
.cl.okc{color:#27a95b}.cl.badc{color:#d62828}
.n6 .ce{font-size:24px}
.pad{display:grid;gap:8px}
.pad button{min-height:52px;font-size:22px}

 function report(game,r){try{parent.postMessage(Object.assign({type:'game-result',game:game,name:name()},r),'*')}catch(e){}}
 function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
 function levelGrid(el,n,key,onPick){const st=ls.get(key,{});el.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('button');const s=st[i]||0;if(s)b.className='done';b.innerHTML=(i+1)+'<small>'+(s?stars(s):'')+'</small>';b.onclick=()=>{snd.tap();onPick(i)};el.appendChild(b)}}
 function saveStars(key,i,s){const st=ls.get(key,{});if((st[i]||0)<s){st[i]=s;ls.set(key,st)}}
 function muteBtn(b){const u=()=>b.textContent=S.mute?'🔇':'🔊';b.onclick=()=>{S.mute=!S.mute;ls.set('g_mute',S.mute);u()};S.mute=!!ls.get('g_mute',false);u()}
 return {ls,$,snd,toast,overlay,name,askName,report,fmt,stars,levelGrid,saveStars,muteBtn,S};
})();

function ex(a,hl){return '<div style="display:inline-flex;gap:3px;margin:4px 6px 4px 0">'+a.map((v,i)=>{const e=hl&&hl[i];return `<span style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;font-size:18px;background:${e==='end'?'#fbc02d':e==='mid'?'#a5e3a8':'#fff'};border:2px solid #cbb26b">${v}</span>`}).join('')+'</div>'}
function rulesHtml(){return `<b>Mục tiêu:</b> điền các số vào ô trống.<br>
<b>① Không lặp số:</b> mỗi hàng, mỗi cột và mỗi khung nhỏ (khung có viền đậm) phải có đủ các số, mỗi số đúng một lần (bảng 4×4 dùng số 1–4, bảng 6×6 dùng số 1–6).<br>
<b>② Số ngoài bảng là "tổng bánh sandwich":</b> trong hàng (hoặc cột) đó, số <b>1</b> và số <b>lớn nhất</b> (4 hoặc 6) là hai lát bánh. Em <b>cộng các số nằm giữa hai lát bánh</b> – đó là phần nhân. Kết quả phải bằng số ghi ngoài bảng.<br>
<div style="margin-top:6px"><b>Ví dụ 1:</b> ${ex([2,1,3,4],{1:'end',3:'end',2:'mid'})} giữa 1 và 4 chỉ có số 3 → tổng = <b>3</b>.</div>
<div><b>Ví dụ 2:</b> ${ex([1,2,3,4],{0:'end',3:'end',1:'mid',2:'mid'})} giữa 1 và 4 có 2 và 3 → tổng = 2 + 3 = <b>5</b>.</div>
<div><b>Ví dụ 3:</b> ${ex([2,4,1,3],{1:'end',2:'end'})} 4 và 1 đứng sát nhau, không có số nào ở giữa → tổng = <b>0</b>.</div>
<span class="note">Ô vàng là hai lát bánh (1 và số lớn nhất), ô xanh là phần nhân. Số ngoài bảng màu <b style="color:#d97706">cam</b> là hàng/cột chưa điền đủ, <b style="color:#27a95b">xanh</b> là đã khớp, <b style="color:#d62828">đỏ</b> là điền đủ rồi nhưng chưa khớp. Hàng/cột không có số ngoài bảng thì không bị ràng buộc.</span>`}
function home(){app.innerHTML=`<div class="top"><h1>🥪 Sandwich Sudoku</h1><button class="btn sec" id="mu"></button></div>
<div class="card how">${rulesHtml()}</div>
<div class="lv" id="lv"></div><p class="note">Màn 1–8: bảng 4×4. Màn 9–30: bảng 6×6, càng về sau càng ít số cho sẵn. Trong lúc chơi bấm nút <b>❓ Luật</b> để xem lại, chạm một ô để xem hàng và cột của ô đó đang cần tổng bao nhiêu.</p>`;G.muteBtn(G.$('mu'));G.levelGrid(G.$('lv'),LV.length,KEY,i=>G.askName(()=>play(i)))}
function between(a){const i=a.indexOf(1),j=a.indexOf(N);if(i<0||j<0||a.includes(0))return null;const x=Math.min(i,j),y=Math.max(i,j);let s=0;for(let k=x+1;k<y;k++)s+=a[k];return s}
function play(i){cur=i;L=LV[i];N=L.n;BR=2;BC=N===4?2:3;gv=L.givens;g=gv.map(r=>r.slice());sel=null;errs=0;t0=Date.now();done=false;
 app.innerHTML=`<div class="top"><button class="btn sec" id="bk">←</button><h1>Màn ${i+1} <small class="note">(${N}×${N})</small></h1><button class="btn sec" id="mu"></button></div>
<div class="stats"><div class="stat"><small>Thời gian</small><b id="tt">0:00</b></div><div class="stat"><small>Lỗi</small><b id="er">0</b></div></div>
<div id="gr" class="n${N}"></div><div class="pad" id="pd" style="grid-template-columns:repeat(${N+1},1fr)"></div><p class="note" id="st" style="text-align:center;font-size:15px;min-height:22px;margin:0"></p><div class="row"><button class="btn ok" id="ck">✔ Kiểm tra</button><button class="btn warn" id="hn">💡 Gợi ý</button><button class="btn sec" id="rl">❓ Luật</button><button class="btn sec" id="rs">↺ Làm lại</button></div><p class="note" id="ex" style="text-align:center;font-size:15px;min-height:22px;margin:0;color:#3b2a14"></p>`;
 G.muteBtn(G.$('mu'));G.$('bk').onclick=home;hints=0;G.$('ck').onclick=()=>verify(true);G.$('hn').onclick=hint;G.$('rs').onclick=()=>play(cur);G.$('rl').onclick=()=>{const o=G.overlay('<div style="text-align:left;font-size:15px;line-height:1.5">'+rulesHtml()+'</div><div class="row" style="margin-top:12px"><button class="btn ok" id="rok">Đã hiểu</button></div>');G.$('rok').onclick=()=>o.remove()};
 G.$('pd').innerHTML=Array.from({length:N},(_,k)=>`<button class="btn" data-v="${k+1}">${k+1}</button>`).join('')+'<button class="btn sec" data-v="0">⌫</button>';
 G.$('pd').onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v==null)return;put(+v)};
 const tm=setInterval(()=>{if(!G.$('tt')||done){clearInterval(tm);return}G.$('tt').textContent=G.fmt((Date.now()-t0)/1000)},500);
 draw()}
function conflicts(){const bad=new Set();const add=(a)=>{const m={};a.forEach(([r,c])=>{const v=g[r][c];if(!v)return;(m[v]=m[v]||[]).push([r,c])});Object.values(m).forEach(x=>{if(x.length>1)x.forEach(([r,c])=>bad.add(r*N+c))})};
 for(let r=0;r<N;r++)add(Array.from({length:N},(_,c)=>[r,c]));for(let c=0;c<N;c++)add(Array.from({length:N},(_,r)=>[r,c]));
 for(let r0=0;r0<N;r0+=BR)for(let c0=0;c0<N;c0+=BC){const a=[];for(let r=r0;r<r0+BR;r++)for(let c=c0;c<c0+BC;c++)a.push([r,c]);add(a)}return bad}
function draw(){const bad=conflicts();let h='';const gr=G.$('gr');gr.style.gridTemplateColumns=`0.8fr repeat(${N},1fr)`;
 h+='<div class="cl"></div>';for(let c=0;c<N;c++){const s=between(g.map(r=>r[c]));const cl=L.cols[c];h+=`<div class="cl ${cl!=null&&s!=null?(s===cl?'okc':'badc'):''}">${cl==null?'':cl}</div>`}
 for(let r=0;r<N;r++){const s=between(g[r]),rl=L.rows[r];h+=`<div class="cl ${rl!=null&&s!=null?(s===rl?'okc':'badc'):''}">${rl==null?'':rl}</div>`;
  for(let c=0;c<N;c++){const v=g[r][c],given=gv[r][c]>0;const bt=r%BR===0&&r>0?'border-top:3px solid #8a6a2a;':'',bl=c%BC===0&&c>0?'border-left:3px solid #8a6a2a;':'';
   h+=`<div class="ce${given?' g':v?' u':''}${sel&&sel[0]===r&&sel[1]===c?' sel':''}${bad.has(r*N+c)?' bad':''}" data-r="${r}" data-c="${c}" style="${bt}${bl}">${v||''}</div>`}}
 gr.innerHTML=h;gr.onclick=e=>{const t=e.target.closest('.ce');if(!t||done)return;const r=+t.dataset.r,c=+t.dataset.c;if(gv[r][c])return;sel=[r,c];G.snd.tap();draw()};
 G.$('er').textContent=errs;explain()}
function put(v){if(done||!sel)return;const[r,c]=sel;const before=conflicts().size;g[r][c]=v;const bad=conflicts();if(v&&bad.has(r*N+c)){errs++;G.snd.bad()}else G.snd.tap();draw();if(!check())verify(false)}
function explain(){const e=G.$('ex');if(!e)return;if(!sel){e.textContent='Chạm vào một ô để xem hàng và cột của ô đó cần tổng bao nhiêu.';return}const [r,c]=sel;const one=(name,arr,need)=>{const i=arr.indexOf(1),j=arr.indexOf(N);if(need==null)return name+': không có số ngoài bảng (không bị ràng buộc).';if(i<0||j<0)return name+': cần tổng giữa số 1 và số '+N+' bằng '+need+'.';const x=Math.min(i,j),y=Math.max(i,j),mid=arr.slice(x+1,y);if(mid.includes(0))return name+': cần tổng bằng '+need+' (còn ô trống ở giữa 1 và '+N+').';const sum=mid.reduce((a,b)=>a+b,0);return name+': giữa 1 và '+N+' '+(mid.length?'có '+mid.join(' + ')+' = '+sum:'không có số nào → 0')+' (cần '+need+(sum===need?' ✓':' ✗')+').'};e.innerHTML=one('Hàng '+(r+1),g[r],L.rows[r])+'<br>'+one('Cột '+(c+1),g.map(x=>x[c]),L.cols[c])}
function msg(t,bad){const e=G.$('st');if(e){e.textContent=t||'';e.style.color=bad?'#d62828':'#8a6a2a'}}
function verify(manual){if(done)return;const bad=conflicts();const empty=g.some(r=>r.includes(0));const wr=[],wc=[];for(let r=0;r<N;r++){const s=between(g[r]);if(L.rows[r]!=null&&s!==null&&s!==L.rows[r])wr.push(r+1)}for(let c=0;c<N;c++){const s=between(g.map(x=>x[c]));if(L.cols[c]!=null&&s!==null&&s!==L.cols[c])wc.push(c+1)}
 if(bad.size){msg('Có số bị lặp trong hàng, cột hoặc khung (ô màu đỏ). Em sửa lại nhé.',1);if(manual)G.snd.bad();return}
 if(empty){msg(manual?'Em điền hết các ô trống rồi bấm kiểm tra nhé.':'');return}
 if(wr.length||wc.length){msg('Đã điền đủ nhưng chưa đúng: tổng giữa số 1 và số '+N+' chưa khớp ở '+(wr.length?'hàng '+wr.join(', '):'')+(wr.length&&wc.length?' và ':'')+(wc.length?'cột '+wc.join(', '):'')+' (các số đỏ ngoài bảng). Em đổi chỗ các số rồi thử lại.',1);G.snd.bad()}}
function hint(){if(done||(sel===null&&false))return;let t=null;if(sel&&!gv[sel[0]][sel[1]]&&g[sel[0]][sel[1]]!==L.sol[sel[0]][sel[1]])t=sel;if(!t)for(let r=0;r<N&&!t;r++)for(let c=0;c<N;c++)if(!gv[r][c]&&g[r][c]!==L.sol[r][c]){t=[r,c];break}if(!t)return;hints++;sel=t;g[t[0]][t[1]]=L.sol[t[0]][t[1]];G.snd.ok();msg('Gợi ý: đã điền một ô đúng cho em.');draw();if(!check())verify(false)}
function check(){if(g.some(r=>r.includes(0)))return false;if(conflicts().size)return false;for(let r=0;r<N;r++){if(L.rows[r]!=null&&between(g[r])!==L.rows[r])return false}for(let c=0;c<N;c++){if(L.cols[c]!=null&&between(g.map(x=>x[c]))!==L.cols[c])return false}
 done=true;const sec=(Date.now()-t0)/1000,st=hints===0&&errs===0?3:hints<=1&&errs<=3?2:1;G.snd.win();G.saveStars(KEY,cur,st);G.report(GAME,{level:cur+1,score:st*10,correct:st,total:3,errors:errs,timeSec:Math.round(sec)});
 const nx=cur+1<LV.length;const o=G.overlay(`<h2>🎉 Giải xong rồi!</h2><div class="stars">${G.stars(st)}</div><p>Em mắc ${errs} lỗi, thời gian ${G.fmt(sec)}.</p><div class="row"><button class="btn ok" id="o1">${nx?'Màn tiếp ➜':'Về chọn màn'}</button><button class="btn sec" id="o3">Chọn màn</button></div>`);
 G.$('o1').onclick=()=>{o.remove();nx?play(cur+1):home()};G.$('o3').onclick=()=>{o.remove();home()};return true}
home();
</script></body></html>
